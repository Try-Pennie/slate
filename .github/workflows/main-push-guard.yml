name: Main-push guard

# Detective backstop for direct pushes to main (#1027). Since 2026-10-23 the
# "Protect main" ruleset PREVENTS a direct push or a red merge (#4197, AGENTS.md);
# this workflow stays for the day that ruleset is switched off or loosened. On every
# push to main it works out whether the commit arrived through a merged PR whose CI
# passed, and if not it fails the run and posts a Slack alert so a human can
# review/revert. It fires AFTER the push (and the deploy). A deliberate direct push,
# possible only with the ruleset off, must carry the `[allow-direct-push]` marker in
# its commit subject to stay silent (#4096: the body is never read).
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  main-push-guard:
    timeout-minutes: 10  # measured max 14s
    runs-on: ${{ vars.PENNIE_CI_RUNNER == 'pennie-mac' && 'pennie-mac' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #1524: NO dependency install. The classification is pure
      # (scripts/lib/main-push-guard.ts imports nothing) and the Slack post now goes
      # through scripts/lib/slack-post.ts, which also imports nothing, so the guard needs
      # node and this checkout and that is all. It used to carry pnpm/action-setup plus a
      # full `pnpm install --frozen-lockfile`, purely to reach the app's notifier and
      # through it the tunable-channel lookup and the Supabase client. On 2026-08-17 run
      # 32039856279 died at `Failed to download action 'pnpm/action-setup'` with a 429
      # after three retries and the only control over main never ran. Every dependency
      # this workflow carries is another way for it to be unavailable in exactly the
      # conditions it exists for, which is why setup-node is the one that stays: it pins
      # the node version the type-stripping flag needs, rather than trusting whatever the
      # runner image happens to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Classify the push and alert on a violation
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL }}
        run: |
          set -euo pipefail

          # PRs associated with this commit. For a squash merge the merge commit
          # on main resolves to the PR it came from (merged_at set); a direct push
          # resolves to none.
          #
          # #1436: a FAILED read is not an empty list. This used to be
          # `|| echo '[]'`, and an empty array is byte for byte what a genuine
          # direct push looks like, so a GitHub outage paged saying somebody had
          # bypassed review. The failure is recorded instead, and the classifier
          # reports it as a check that could not run.
          #
          # #1519: the read RETRIES, in scripts/lib/read-commit-pulls.sh, because
          # one attempt let a momentary GitHub blip blind the guard. It lives in a
          # script rather than inline here so scripts/test-commit-pulls-retry.ts
          # can drive it with a fake `gh`, no remote and no push to main. It still
          # fails closed: exhausting the attempts exits non-zero and lands here.
          PRS_READ_ERROR=""
          if ! pulls="$(bash scripts/lib/read-commit-pulls.sh "$REPO" "$HEAD_SHA")"; then
            PRS_READ_ERROR="gh api could not read the commit's pull requests"
            echo "::warning::main-push-guard: $PRS_READ_ERROR (see the attempt lines above)"
            pulls='[]'
          fi
          export PRS_READ_ERROR
          # A 200 whose body is not an array is also a read this cannot use.
          if ! enriched="$(jq -ce '[.[] | {number, merged: (.merged_at != null), head: .head.sha, ciConclusion: null}]' <<<"$pulls")"; then
            PRS_READ_ERROR="the pull request list was not the expected shape"
            export PRS_READ_ERROR
            echo "::warning::main-push-guard: $PRS_READ_ERROR"
            enriched='[]'
          fi

          # For each merged PR, read the CI conclusion on its own head commit (the
          # pre-merge checks), so a merged-red PR is caught. Unknown stays null and
          # is tolerated by the classifier (the hard signal is "no merged PR").
          count="$(echo "$enriched" | jq 'length')"
          prs="$enriched"
          for i in $(seq 0 "$((count - 1))"); do
            [ "$count" -gt 0 ] || break
            merged="$(echo "$enriched" | jq -r ".[$i].merged")"
            [ "$merged" = "true" ] || continue
            head="$(echo "$enriched" | jq -r ".[$i].head")"
            # parse-ok: fails to "unknown CI", which the classifier deliberately
            # tolerates rather than pages on (see classifyPush): the hard signal is
            # "no merged PR at all", and that half no longer swallows its errors.
            # A false page every time GitHub's checks API blips would be worse than
            # the residual risk of a merged-red PR going unnoticed on the one run
            # where the read also failed.
            concls="$(gh api "/repos/$REPO/commits/$head/check-runs" \
              --jq '[.check_runs[] | select(.name == "ci") | .conclusion]' 2>/dev/null || echo '[]')"
            ci="$(echo "$concls" | jq -r 'if any(.[]; . == "failure") then "failure" elif (length > 0 and all(.[]; . == "success")) then "success" else "null" end')"
            if [ "$ci" != "null" ]; then
              prs="$(echo "$prs" | jq -c --argjson i "$i" --arg c "$ci" '.[$i].ciConclusion = $c')"
            fi
          done

          export PRS_JSON="$(echo "$prs" | jq -c '[.[] | {number, merged, ciConclusion}]')"
          export COMMIT_MESSAGE="$(git log -1 --pretty=%B "$HEAD_SHA")"

          # #1447: when the association index has NO answer, ask the pull requests
          # named in the commit subject whether one of them claims this commit as its
          # own merge commit. GitHub's index can be permanently missing an entry: on
          # 2026-08-13 it returned [] for the squash merge of a reviewed, green PR and
          # still did twenty minutes later, because the merge went through during an
          # API incident. An empty index is byte for byte what a direct push looks
          # like, so with one lookup the guard accuses on a missing record.
          #
          # Reached whenever the association established no merge, which is BOTH an
          # empty index and a read that failed outright (#1519: that endpoint began
          # answering 403 to the workflow token on 2026-08-17, and the classifier
          # was discarding the claims this block had already gathered). The common
          # path, where the association names a merged PR, still costs no extra
          # request. Only the SUBJECT is read: a squash body carries every branch
          # commit message and could name dozens of unrelated PRs.
          MERGE_CLAIMS_JSON='[]'
          if [ "$(jq '[.[] | select(.merged)] | length' <<<"$prs")" = "0" ]; then
            subject="$(head -n 1 <<<"$COMMIT_MESSAGE")"
            claims='[]'
            for num in $(grep -oE '#[0-9]+' <<<"$subject" | tr -d '#' | sort -u); do
              # A PR's own record: is it merged, and is THIS commit its merge commit?
              # A direct push cannot fabricate that, since it would have to make some
              # merged PR's merge_commit_sha equal the commit being pushed.
              # An `if !` rather than `|| echo '{}'`: on a 404 (the number is an ISSUE
              # reference, not a pull request) gh writes its error body to STDOUT and
              # exits non-zero, so the fallback would APPEND a second JSON document and
              # jq would receive a two-document stream. Replacing the value is the only
              # form that cannot do that. Proven by running this block against the real
              # commit that false-paged.
              #
              # parse-ok: a failed read leaves the claim absent, which is the fail-safe
              # side here: this route can only ever EXCUSE a push, so losing it means
              # falling back to the accusation the guard would have made anyway.
              if ! pr="$(gh api "/repos/$REPO/pulls/$num" 2>/dev/null)"; then pr='{}'; fi
              claims="$(jq -c --argjson c "$claims" --arg sha "$HEAD_SHA" --argjson n "$num" \
                '$c + [{
                   number: $n,
                   isMergeCommitOfThisPush: ((.merged_at != null) and (.merge_commit_sha == $sha)),
                   ciConclusion: null
                 }]' <<<"$pr")"
            done
            # CI for a claimed PR is read off its head commit, the same way the
            # association path does, so a red merge is caught on either route.
            claim_count="$(jq 'length' <<<"$claims")"
            for i in $(seq 0 "$((claim_count - 1))"); do
              [ "$claim_count" -gt 0 ] || break
              [ "$(jq -r ".[$i].isMergeCommitOfThisPush" <<<"$claims")" = "true" ] || continue
              cnum="$(jq -r ".[$i].number" <<<"$claims")"
              # parse-ok: an unreadable head sha leaves ciConclusion null via the
              # `continue` below, which the classifier tolerates exactly as it does on
              # the association path. It can only lose the CI half of a merge this
              # route already established, never excuse a push.
              chead="$(gh api "/repos/$REPO/pulls/$cnum" --jq '.head.sha' 2>/dev/null || echo '')"
              [ -n "$chead" ] || continue
              # parse-ok: an unreadable checks list leaves ciConclusion null, which the
              # classifier tolerates exactly as it does on the association path.
              if ! cconcls="$(gh api "/repos/$REPO/commits/$chead/check-runs" \
                --jq '[.check_runs[] | select(.name == "ci") | .conclusion]' 2>/dev/null)"; then
                cconcls='[]'
              fi
              cci="$(jq -r 'if any(.[]; . == "failure") then "failure" elif (length > 0 and all(.[]; . == "success")) then "success" else "null" end' <<<"$cconcls")"
              if [ "$cci" != "null" ]; then
                claims="$(jq -c --argjson i "$i" --arg c "$cci" '.[$i].ciConclusion = $c' <<<"$claims")"
              fi
            done
            MERGE_CLAIMS_JSON="$claims"
            if [ -n "$PRS_READ_ERROR" ]; then why="could not be read ($PRS_READ_ERROR)"; else why="was empty"; fi
            echo "::notice::main-push-guard: the commit association $why, so the pull requests named in the subject were asked directly: $MERGE_CLAIMS_JSON"
          fi
          export MERGE_CLAIMS_JSON

          # No alias hook: nothing under src/ is reachable from here any more, and
          # scripts/test-main-push-guard.ts runs this exact command line to prove it.
          node --experimental-strip-types scripts/check-main-push.ts

      # #1523: say so when the guard itself could not run.
      #
      # The Slack alert is posted from the classify step, so until now every step before
      # it (the checkout, the action download, the install) could fail with the run going
      # red and NOTHING sent anywhere. That is the same blind spot as #1519 one level up:
      # there the guard could not reach a verdict, here it could not reach the step that
      # speaks. Observed on 2026-08-17: run 32039856279 went red on a 429 and was found
      # only because somebody happened to be reading the run list. A red run nobody is
      # told about is the same as no guard, with the added problem that it looks like it
      # ran.
      #
      # THREE states, not two: a clean pass (silent), a real violation (the classify step
      # alerts and records `handled=true`), and this one. The gate on that marker is what
      # keeps a violation from double-posting, and two alerts about one commit is how a
      # reader learns to skim.
      #
      # It must survive the failure it is reporting, so it uses plain curl and downloads
      # no action of its own: an action download is what took the guard out, and anything
      # the install had to provide is unavailable exactly when this step matters.
      # #1523: say so when the guard itself could not run.
      #
      # The violation alert is posted from the classify step, so until now every step
      # before it could fail with the run going red and NOTHING sent anywhere. This
      # workflow was then the only control over main (the ruleset came later, #4197), and
      # the whole design rests on it failing the run AND telling a human (#1027).
      # When it dies early only the first half happens, and a red run nobody is told about
      # is the same as no guard, with the added problem that it looks like it ran. Observed
      # on 2026-08-17: run 32039856279 died on a 429 downloading an action and was found
      # only because somebody happened to be reading the run list. Same blind spot as #1519
      # one level up: there the guard could not reach a verdict, here it could not reach
      # the step that speaks.
      #
      # THREE states, not two: a clean pass (silent), a real violation (the classify step
      # alerts and records handled=true), and this. The gate on that marker is what keeps a
      # violation from double-posting, and two alerts about one commit is how a reader
      # learns to skim.
      #
      # WHY THE SHELL IS INLINE rather than in scripts/, which is where this repo normally
      # puts testable shell: it must not need ANY earlier step to have succeeded, and the
      # checkout is an earlier step. A script in the repository cannot run when the thing
      # that failed was fetching the repository, which is the most basic failure there is.
      # It is still tested: scripts/test-guard-unrun-alert.ts extracts this exact block out
      # of this file and runs it against a fake curl, so what is proven is what ships, and
      # the extraction refuses to pass on an empty match.
      #
      # It uses curl and jq, both on the runner image, and downloads no action of its own,
      # since an action download is what took the guard out.
      #
      # WHAT THIS STILL DOES NOT COVER, deliberately: a push to main that never triggers a
      # run at all. #1523 suggested a heartbeat the lane watchdog reads, and that does not
      # fit a push-triggered workflow: a staleness bound would page every time nobody
      # pushed to main for a while, which is an ordinary weekend, and an alert that cries
      # wolf is the one everybody learns to ignore (L36). Noticing a dropped event needs a
      # different mechanism, comparing main's commits against this workflow's runs, which
      # is #1531.
      - name: Say so when the guard itself could not run
        if: failure() && steps.classify.outputs.handled != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL }}
        run: |
          set -uo pipefail

          RUN_URL="${RUN_URL:-}"
          HEAD_SHA="${HEAD_SHA:-}"
          ACTOR="${ACTOR:-}"

          # An unset repo variable interpolates to the EMPTY STRING rather than failing the run
          # (#1500), so an empty channel is the expected shape of a missing one and has to be
          # checked for. There is deliberately no database fallback here: reaching the tunable
          # channel is what made this guard need a dependency install in the first place (#1524).
          # Each half names itself, because the fixes differ: one is a secret, one is a variable.
          missing=""
          [ -n "${SLACK_BOT_TOKEN:-}" ] || missing="the SLACK_BOT_TOKEN secret"
          if [ -z "${SLACK_ALERTS_CHANNEL:-}" ]; then
            if [ -n "$missing" ]; then missing="$missing and the SLACK_ALERTS_CHANNEL variable"
            else missing="the SLACK_ALERTS_CHANNEL variable"; fi
          fi
          if [ -n "$missing" ]; then
            echo "::error title=main-push guard could not alert::The guard failed before it could check this push, and $missing is not configured, so nobody was told automatically. Main is unguarded for commit ${HEAD_SHA}. Re-run the job: ${RUN_URL}"
            exit 1
          fi

          # Deliberately NOT the violation wording. This is not an accusation about the commit, it
          # is a report that nothing was checked, and telling somebody to revert over an
          # infrastructure failure is advice that cannot fix the state they are in (L11, L111).
          text="The main-push guard could not run, so this push to main was never checked. Nothing here says the commit is bad: the guard failed before it could look, which on the last occurrence was a rate limited action download during a GitHub incident. Main is unguarded for commit ${HEAD_SHA} by ${ACTOR}. Re-run the job to check it: ${RUN_URL}"

          payload="$(jq -nc --arg channel "$SLACK_ALERTS_CHANNEL" --arg text "$text" \
            '{channel: $channel, text: $text}')"

          # --fail-with-body so a non-2xx is a non-zero exit that still prints the body. `|| true`
          # so a curl failure reaches the check below as a body rather than killing the script under
          # pipefail, which would skip the error line that is the whole point of this file.
          body="$(curl --silent --show-error --fail-with-body --max-time 20 \
            -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$payload" 2>&1)" || true

          if printf '%s' "$body" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "::notice::main-push guard: the run failed before it could check this push, and that was reported to Slack"
          else
            echo "::error title=main-push guard could not alert::The guard failed before it could check ${HEAD_SHA}, AND the Slack post about that failed too, so nobody was told automatically. Main is unguarded for this commit. Re-run the job: ${RUN_URL}. Slack said: ${body}"
          fi

          # Always red: the push was not checked.
          exit 1
