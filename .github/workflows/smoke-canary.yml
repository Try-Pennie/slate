name: Smoke canary

# Scheduled production canary for the booking path (#525). Runs the existing smoke
# scripts against live prod on the dedicated SMOKE test agents/buckets (#396):
#   - half past each hour: the side-effect-free dry-run health tick (SMOKE_DRY_RUN_ONLY)
#   - on each hour:        the full strict pass (SMOKE_STRICT) plus the reschedule smoke
#     (#1493, Dan 2026-10-16: hourly now that real leads book through Slate, so a
#     broken booking path is noticed within the hour rather than within six; between
#     9pm and 8am ET a full pass failure pages only on the second in a row, decided
#     by the Worker in src/lib/monitor/smoke-canary-failure.ts)
# On success it stamps the smoke-canary heartbeat, so a schedule that silently
# stops firing goes stale and the lane-watchdog pages (CANARY_STALE_BOUNDS_MS). The
# full pass ALSO stamps a separate smoke-canary-full heartbeat (#982): the dry tick
# keeps smoke-canary fresh every 30 min, so without its own heartbeat a
# silently-dropped full run (the only automated proof a booking can be made,
# rescheduled, and cancelled) would never go stale and never page. Any failure (a
# real regression, or a bad key / missing fixture) posts a Slack alert.
# workflow_dispatch runs either pass on demand.
#
# GitHub's schedule below is best-effort and DROPS runs under load (observed 2-3h
# gaps against the 30-min cadence), which aged the heartbeat past its 90m bound and
# false-paged. So it is now a BACKUP: the Worker's monitor cron lane reliably fills
# the gap by firing this workflow (workflow_dispatch, dry pass) via GitHub's API
# when the heartbeat goes stale (src/lib/monitor/canary-trigger.ts, needs the
# GITHUB_CANARY_TOKEN Worker secret). The concurrency group below does NOT dedupe:
# GitHub cancels a run pending in the group in favour of the newest, whichever mode
# each is. So the gap-filler first asks GitHub whether a run of this workflow is
# already queued or running, and waits on it rather than dispatching (#4009).
#
# Needs repo secrets BOOKING_API_KEY_CANARY and REASSIGN_API_KEY (the Worker's keys, added
# to Actions), and the existing SLACK_BOT_TOKEN secret + SLACK_ALERTS_CHANNEL var.
#
# #2822: the canary sends its OWN key and is recorded as `canary`. The shared
# BOOKING_API_KEY is retired (#2865) and the Worker holds none, so a step sending it
# would be refused; scripts/test-canary-key-wiring.ts fails the build first. The
# GitHub secret must hold the SAME value as the Worker's BOOKING_API_KEY_CANARY secret:
# a value the Worker does not hold is a 401 on the first step, which fails the run
# and alerts.
on:
  schedule:
    - cron: "30 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Which pass to run
        type: choice
        options: [dry, full]
        default: dry

# Never cancel a canary run in flight: a half-run full pass leaves real bookings
# mid-teardown, so let each run complete.
concurrency:
  group: smoke-canary
  cancel-in-progress: false

jobs:
  canary:
    timeout-minutes: 15  # measured max 139s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Skip quietly until BOOKING_API_KEY_CANARY is configured as a repo secret, so
      # merging this doesn't spam Slack every 30 min before setup. An absent key is
      # "not configured yet"; a present-but-wrong key still runs and alerts. A skip
      # stamps no heartbeat, so a secret deleted later goes stale against the lane
      # watchdog's bound and pages rather than staying quiet for ever.
      - name: Preflight (is the canary configured?)
        id: pre
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
        run: |
          if [ -n "$BOOKING_API_KEY_CANARY" ]; then
            echo "configured=1" >> "$GITHUB_OUTPUT"
          else
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "::notice::BOOKING_API_KEY_CANARY is not set as a repo secret, so the smoke canary is skipping. Add it (and REASSIGN_API_KEY) in Settings > Secrets and variables > Actions."
          fi

      # `embed` flags the browser check (below), which stays on every sixth full pass
      # (#1493): it is judged by the UTC hour the run STARTS in, so a run GitHub starts
      # an hour late skips the browser for that cycle and the next one runs it.
      - name: Select pass (full on the hourly cron or a manual full dispatch, else dry)
        id: mode
        if: steps.pre.outputs.configured == '1'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$SCHEDULE" = "0 * * * *" ] || [ "$DISPATCH_MODE" = "full" ]; then
            echo "full=1" >> "$GITHUB_OUTPUT"
            hour=$((10#$(date -u +%H)))
            if [ "$DISPATCH_MODE" = "full" ] || [ $((hour % 6)) -eq 0 ]; then
              echo "embed=1" >> "$GITHUB_OUTPUT"
            else
              echo "embed=0" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "full=0" >> "$GITHUB_OUTPUT"
            echo "embed=0" >> "$GITHUB_OUTPUT"
          fi

      # EXPECT_HTTPS_REDIRECT arms the http->https redirect guard (#1024/#1203) so a
      # regression FAILS the run instead of printing "not armed". A repo Actions
      # variable does NOT reach the process unless the step names it: the variable
      # was set on 2026-07-31 and the guard stayed inert for two weeks because this
      # line was missing (#1494). scripts/test-workflow-env-coverage.ts now fails the
      # build on any var a workflow-run script reads that no step provides.
      # SLATE_BASE_URL is wired for the same reason: the heartbeat steps below
      # already read it, so without it here the smoke could test a different origin
      # from the one being stamped alive. An unset variable arrives as "", which the
      # scripts' envOr treats as absent (never as a base URL of "").
      # SMOKE_FAILURE_FILE lets each run record WHICH checks failed, so the Slack
      # alert names them instead of one sentence covering every possible cause
      # (#1492). A literal path, not a repo variable: it is an internal handoff
      # between two steps of the same job, and the alert step reads the same path.
      - name: Booking smoke (dry-run health tick)
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.full == '0'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          EXPECT_HTTPS_REDIRECT: ${{ vars.EXPECT_HTTPS_REDIRECT }}
          SMOKE_FAILURE_FILE: smoke-failures.txt
          SMOKE_DRY_RUN_ONLY: "1"
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/smoke-booking-api.ts

      - name: Booking smoke (full strict pass)
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.full == '1'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          REASSIGN_API_KEY: ${{ secrets.REASSIGN_API_KEY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          EXPECT_HTTPS_REDIRECT: ${{ vars.EXPECT_HTTPS_REDIRECT }}
          SMOKE_FAILURE_FILE: smoke-failures.txt
          SMOKE_STRICT: "1"
          # No Google service-account creds on the runner, so skip the orphan-event
          # sweep; the API-driven cancels still tear down every booking server-side.
          SMOKE_SKIP_EVENT_CLEANUP: "1"
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/smoke-booking-api.ts

      - name: Reschedule smoke (full pass only)
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.full == '1'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          SMOKE_FAILURE_FILE: smoke-failures.txt
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/smoke-reschedule.ts

      # #1047: the canary proved the funnel works and said nothing about whether it
      # is fast. This times the cached availability read and fails past a stated
      # budget, recording the reason through the SAME failure log the booking smoke
      # uses so the existing alerter names it rather than needing a second alerting
      # path. It runs on EVERY tick (30 min), not only the full pass: it is a read,
      # it writes nothing, and a latency regression is exactly the kind of thing worth
      # catching in half an hour rather than six.
      #
      # `continue-on-error` is deliberate and is the whole reason this is safe to add.
      # A latency budget is the classic source of a flapping alert, and a flapping
      # check that fails the JOB would stop the heartbeat below from being stamped,
      # which would page the lane watchdog for a slow read. So it records its failure,
      # the alert step reports it, and the run continues.
      - name: Availability latency (read path)
        id: latency
        continue-on-error: true
        if: success() && steps.pre.outputs.configured == '1'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          SMOKE_FAILURE_FILE: smoke-failures.txt
        run: node --experimental-strip-types scripts/smoke-latency.ts

      # #1700: stamped ONLY when the latency check read a real median, pass or fail,
      # never merely because the step ran. A check whose every request was refused says
      # "not measured" and exits 0 on purpose (the availability check already fails for
      # that), so without this a check that has stopped measuring reads as a healthy one
      # every 30 minutes. Left unstamped, the verdict goes stale and the lane watchdog
      # pages (VERDICT_STALE_BOUNDS_MS).
      #
      # `always()` is load bearing. A confirmed regression fails the latency step, and
      # without a status function GitHub ANDs `success()` into a custom `if`, which would
      # skip the stamp on exactly the run that measured most clearly. Whether the check
      # concluded and whether the read was fast are two different facts (L53).
      - name: Stamp the latency verdict (a measured reading only)
        if: always() && steps.pre.outputs.configured == '1' && steps.latency.outputs.measured == '1'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
        run: |
          base="${SLATE_BASE_URL:-https://slate.trypennie.app}"
          curl -fsS -X POST "${base%/}/api/smoke/heartbeat?lane=verdict:availability-latency" \
            -H "authorization: Bearer $BOOKING_API_KEY_CANARY"

      # #1006: the uptime canary proves the SERVER responds and cannot prove the
      # front end draws. cal.com is watched by a Checkly browser check that loads
      # the embedded scheduler and confirms the modal appears; Slate's embed had no
      # equivalent, so a regression leaving the booker blank would go unnoticed.
      #
      # EVERY SIXTH FULL PASS (every 6h), not every run. This is a private repo,
      # so Actions minutes are billed, and a real browser on every tick is roughly
      # 48 runs a day against 4 for the same class of fault. An embed regression
      # arrives with a deploy rather than drifting in, so six hours is the right
      # granularity for the money. When the full pass went hourly (#1493) this
      # stayed six hourly for that reason, through the mode step's `embed` flag.
      #
      # `continue-on-error`, for the same reason the latency step carries it: a
      # browser against the public internet is the classic source of a flapping
      # check, and one that failed the JOB would stop the heartbeat below being
      # stamped, which would page the lane watchdog for a slow page load. It
      # records its failure, the alert step reports it, and the run continues.
      - name: Cache the browser
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.embed == '1'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pinned playwright version in the lockfile, so a bump
          # fetches a matching browser instead of silently reusing an old one.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the browser
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.embed == '1'
        # chromium only, and --with-deps for the system libraries a headless run
        # needs. A cache hit makes this a few seconds.
        run: pnpm exec playwright install --with-deps chromium

      - name: Embed render check (every sixth full pass)
        id: embed
        continue-on-error: true
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.embed == '1'
        env:
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          SMOKE_FAILURE_FILE: smoke-failures.txt
        # Deliberately NO BOOKING_API_KEY_CANARY and NO SMOKE_BUCKET here. The other
        # canary steps drive the hidden SMOKE bucket with a bearer token; a BROWSER
        # cannot send one, so the booker correctly refuses that bucket and this
        # check would false-page every full pass. It drives a real bucket instead.
        # Measured against the real deployment on 2026-09-02, which is the only way
        # this was going to be found.
        #
        # Run WITH the alias hook, unlike the latency step next door. That flag is
        # how scripts/test-dependency-free-scripts.ts tells an invocation that
        # depends on the install from one that must survive without it: the three
        # alerters run bare because they are what has to still work when something
        # else has already gone wrong, and every dependency is another way for them
        # to be unavailable in exactly those conditions. This step is not one of
        # those. It drives a real browser, so it cannot be dependency free, and
        # marking it bare would either weaken that guard or make it fail on a
        # script it was never written about.
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/smoke-embed-render.ts

      - name: Stamp canary heartbeat (success only)
        if: success() && steps.pre.outputs.configured == '1'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
        run: |
          base="${SLATE_BASE_URL:-https://slate.trypennie.app}"
          curl -fsS -X POST "${base%/}/api/smoke/heartbeat" \
            -H "authorization: Bearer $BOOKING_API_KEY_CANARY"

      # #982: stamp the SEPARATE smoke-canary-full heartbeat, but only after a
      # successful FULL pass. The dry tick keeps smoke-canary fresh every 30 min,
      # so this is the only signal that the full book/reschedule/cancel proof is
      # still running; a dropped hourly run leaves this heartbeat to go stale and page.
      - name: Stamp full-pass canary heartbeat (full pass success only)
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.full == '1'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
        run: |
          base="${SLATE_BASE_URL:-https://slate.trypennie.app}"
          curl -fsS -X POST "${base%/}/api/smoke/heartbeat?lane=smoke-canary-full" \
            -H "authorization: Bearer $BOOKING_API_KEY_CANARY"

      # #3801: a run with nothing failing tells the Worker, so a failure it posted for
      # this pass clears with an all-clear (a clean full pass clears the dry tick's
      # too). The exact negation of the alert step's condition below, so every run
      # reports exactly one of the two. `continue-on-error` because a Worker that
      # cannot be reached must not turn a clean run red and fire the alert step about
      # a canary that passed; the all-clear is retried by the next clean run.
      - name: Report a clean canary run
        if: success() && steps.pre.outputs.configured == '1' && steps.latency.outcome != 'failure' && steps.embed.outcome != 'failure'
        continue-on-error: true
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          SMOKE_MODE: ${{ steps.mode.outputs.full == '1' && 'full' || 'dry' }}
        run: |
          base="${SLATE_BASE_URL:-https://slate.trypennie.app}"
          curl -fsS -X POST "${base%/}/api/smoke/failure" \
            -H "authorization: Bearer $BOOKING_API_KEY_CANARY" \
            -H "content-type: application/json" \
            -d "{\"outcome\":\"passed\",\"mode\":\"$SMOKE_MODE\"}"

      # The latency and embed steps are `continue-on-error`, so a failure in either
      # does NOT make the job fail, and `failure()` alone would leave it recorded in
      # the failure log and reported to nobody. Each outcome is consulted explicitly
      # (#1047, #1006). A step added here without being named on this line is a
      # check whose failures are written down and read by no one.
      #
      # #3801: the alerter hands the failure to the Worker first, which posts it through
      # the alert throttle (at once for a newly failing check, else once a day), and
      # posts directly only when that handoff fails, so the alert still works when the
      # Worker is what is down. Hence the canary key and base URL here.
      - name: Slack alert on failure
        if: (failure() || steps.latency.outcome == 'failure' || steps.embed.outcome == 'failure') && steps.pre.outputs.configured == '1'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL }}
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          SMOKE_MODE: ${{ steps.mode.outputs.full == '1' && 'full' || 'dry' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Same path the smoke steps wrote to. An ABSENT file is a real outcome, not
          # an error: it means the run died before any check reported, and the alert
          # says that rather than implying a booking regression (#1492).
          SMOKE_FAILURE_FILE: smoke-failures.txt
        # #1598: bare node, no alias hook. The canary's own steps genuinely need the
        # install (they drive the real booking path through the app), so it stays in this
        # workflow; what this step no longer needs is for that install to have WORKED.
        # This is the step that speaks when something has already gone wrong, and the
        # alerter now posts through scripts/lib/slack-post.ts, which imports nothing.
        run: node --experimental-strip-types scripts/notify-smoke-failure.ts
