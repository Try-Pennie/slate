name: Smoke canary

# Scheduled production canary for the booking path (#525). Runs the existing smoke
# scripts against live prod on the dedicated SMOKE test agents/buckets (#396):
#   - every 30 min: the side-effect-free dry-run health tick (SMOKE_DRY_RUN_ONLY)
#   - every 6h:     the full strict pass (SMOKE_STRICT) plus the reschedule smoke
# On success it stamps the smoke-canary heartbeat, so a schedule that silently
# stops firing goes stale and the lane-watchdog pages (CANARY_STALE_BOUNDS_MS). The
# full pass ALSO stamps a separate smoke-canary-full heartbeat (#982): the dry tick
# keeps smoke-canary fresh every 30 min, so without its own heartbeat a
# silently-dropped 6h full run (the only automated proof a booking can be made,
# rescheduled, and cancelled) would never go stale and never page. Any failure (a
# real regression, or a bad key / missing fixture) posts a Slack alert.
# workflow_dispatch runs either pass on demand.
#
# GitHub's schedule below is best-effort and DROPS runs under load (observed 2-3h
# gaps against the 30-min cadence), which aged the heartbeat past its 90m bound and
# false-paged. So it is now a BACKUP: the Worker's monitor cron lane reliably fills
# the gap by firing this workflow (workflow_dispatch, dry pass) via GitHub's API
# when the heartbeat goes stale (src/lib/monitor/canary-trigger.ts, needs the
# GITHUB_CANARY_TOKEN Worker secret). The concurrency group below dedupes any
# overlap between the two triggers.
#
# Needs repo secrets BOOKING_API_KEY and REASSIGN_API_KEY (the Worker's keys, added
# to Actions), and the existing SLACK_BOT_TOKEN secret + SLACK_ALERTS_CHANNEL var.
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Which pass to run
        type: choice
        options: [dry, full]
        default: dry

# Never cancel a canary run in flight: a half-run full pass leaves real bookings
# mid-teardown, so let each run complete.
concurrency:
  group: smoke-canary
  cancel-in-progress: false

jobs:
  canary:
    timeout-minutes: 15  # measured max 139s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Skip quietly until BOOKING_API_KEY is configured as a repo secret, so
      # merging this doesn't spam Slack every 30 min before setup. An absent key is
      # "not configured yet"; a present-but-wrong key still runs and alerts.
      - name: Preflight (is the canary configured?)
        id: pre
        env:
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
        run: |
          if [ -n "$BOOKING_API_KEY" ]; then
            echo "configured=1" >> "$GITHUB_OUTPUT"
          else
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "::notice::BOOKING_API_KEY is not set as a repo secret, so the smoke canary is skipping. Add it (and REASSIGN_API_KEY) in Settings > Secrets and variables > Actions."
          fi

      - name: Select pass (full on the 6h cron or a manual full dispatch, else dry)
        id: mode
        if: steps.pre.outputs.configured == '1'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$SCHEDULE" = "0 */6 * * *" ] || [ "$DISPATCH_MODE" = "full" ]; then
            echo "full=1" >> "$GITHUB_OUTPUT"
          else
            echo "full=0" >> "$GITHUB_OUTPUT"
          fi

      # EXPECT_HTTPS_REDIRECT arms the http->https redirect guard (#1024/#1203) so a
      # regression FAILS the run instead of printing "not armed". A repo Actions
      # variable does NOT reach the process unless the step names it: the variable
      # was set on 2026-07-31 and the guard stayed inert for two weeks because this
      # line was missing (#1494). scripts/test-workflow-env-coverage.ts now fails the
      # build on any var a workflow-run script reads that no step provides.
      # SLATE_BASE_URL is wired for the same reason: the heartbeat steps below
      # already read it, so without it here the smoke could test a different origin
      # from the one being stamped alive. An unset variable arrives as "", which the
      # scripts' envOr treats as absent (never as a base URL of "").
      # SMOKE_FAILURE_FILE lets each run record WHICH checks failed, so the Slack
      # alert names them instead of one sentence covering every possible cause
      # (#1492). A literal path, not a repo variable: it is an internal handoff
      # between two steps of the same job, and the alert step reads the same path.
      - name: Booking smoke (dry-run health tick)
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.full == '0'
        env:
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          EXPECT_HTTPS_REDIRECT: ${{ vars.EXPECT_HTTPS_REDIRECT }}
          SMOKE_FAILURE_FILE: smoke-failures.txt
          SMOKE_DRY_RUN_ONLY: "1"
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/smoke-booking-api.ts

      - name: Booking smoke (full strict pass)
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.full == '1'
        env:
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          REASSIGN_API_KEY: ${{ secrets.REASSIGN_API_KEY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          EXPECT_HTTPS_REDIRECT: ${{ vars.EXPECT_HTTPS_REDIRECT }}
          SMOKE_FAILURE_FILE: smoke-failures.txt
          SMOKE_STRICT: "1"
          # No Google service-account creds on the runner, so skip the orphan-event
          # sweep; the API-driven cancels still tear down every booking server-side.
          SMOKE_SKIP_EVENT_CLEANUP: "1"
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/smoke-booking-api.ts

      - name: Reschedule smoke (full pass only)
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.full == '1'
        env:
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          SMOKE_FAILURE_FILE: smoke-failures.txt
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/smoke-reschedule.ts

      - name: Stamp canary heartbeat (success only)
        if: success() && steps.pre.outputs.configured == '1'
        env:
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
        run: |
          base="${SLATE_BASE_URL:-https://slate.trypennie.app}"
          curl -fsS -X POST "${base%/}/api/smoke/heartbeat" \
            -H "authorization: Bearer $BOOKING_API_KEY"

      # #982: stamp the SEPARATE smoke-canary-full heartbeat, but only after a
      # successful FULL pass. The dry tick keeps smoke-canary fresh every 30 min,
      # so this is the only signal that the full book/reschedule/cancel proof is
      # still running; a dropped 6h run leaves this heartbeat to go stale and page.
      - name: Stamp full-pass canary heartbeat (full pass success only)
        if: success() && steps.pre.outputs.configured == '1' && steps.mode.outputs.full == '1'
        env:
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
        run: |
          base="${SLATE_BASE_URL:-https://slate.trypennie.app}"
          curl -fsS -X POST "${base%/}/api/smoke/heartbeat?lane=smoke-canary-full" \
            -H "authorization: Bearer $BOOKING_API_KEY"

      - name: Slack alert on failure
        if: failure() && steps.pre.outputs.configured == '1'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL }}
          SMOKE_MODE: ${{ steps.mode.outputs.full == '1' && 'full' || 'dry' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Same path the smoke steps wrote to. An ABSENT file is a real outcome, not
          # an error: it means the run died before any check reported, and the alert
          # says that rather than implying a booking regression (#1492).
          SMOKE_FAILURE_FILE: smoke-failures.txt
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/notify-smoke-failure.ts
