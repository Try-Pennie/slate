name: Booking path load run

# Ten times the booking path's peak against an ISOLATED branch and deployment
# (#2243, #2244). It creates about seven hundred bookings at 90 advisors (the steady
# pass is sized from the load bar, LOAD_RUN_BOOKINGS_PER_MINUTE, #3124), so it is
# `workflow_dispatch` ONLY and every job that touches a system names the loadtest one.
#
# The shape of the run, and why each piece is here:
#
#   preflight   proves a booking made through this deployment leaves the rows the
#               judge looks for, that its event id is the STUB'S shape (so the run
#               cannot make hundreds of real calendar events), and that the
#               database really refuses a planted clash. Nothing downstream means
#               anything if this does not pass.
#   setup-burst picks the ONE plan every burst driver fires: for each of three
#               bursts its kind, two sibling codes, ONE slot and ONE moment, because
#               a burst whose drivers each chose their own is not a burst: nothing
#               contends and everything succeeds. Each ladder is MEASURED (#2278,
#               #3429) through the booker's own predicates, since a crowd now walks
#               the tier ladder (#3338): the two REFUSAL controls fire at the ladder
#               whose whole capacity is smallest and below the crowd of a hundred,
#               and the TIER DROP burst fires about ten confirms at the shallowest top
#               rung with room for twice that below it, at a slot where the booker's
#               own candidate read says the top rung has somebody free. The sibling
#               is a second code whose fallback ladder is the same pools at every
#               rung (#3325), so each burst also proves the shared confirm line
#               ACROSS codes the line treats as one.
#   burst       four drivers firing at each of three moments, a minute apart, at
#               three slots an hour apart, each burst split across its two codes and
#               judged on its own (#3325): one lucky spread of isolates cannot pass
#               the run. One winner PER AGENT is `bookings_active_slot_uniq` doing
#               its job under real contention; every confirm on the SHARED line is
#               the shared line doing its. Once each burst settles, every driver asks
#               `/api/bookings/bookable` whether its slot is still bookable (#3429),
#               and the judge holds each burst to the confirm crowd rule the
#               deployment declares: no SLOT_TAKEN while the slot still answers
#               available, the refusal control's losers told within two seconds of
#               its last winner, and every drop burst confirm winning, a rung down
#               on distinct advisors. It runs BEFORE the steady pass, on purpose:
#               the steady mix can include the burst's codes, so a steady driver
#               taking a burst slot first would make burst requests SLOT_TAKEN for a
#               reason that has nothing to do with contention.
#   burst-tail  `wrangler tail` from before the first burst's moment until the last
#               burst's lines are in (#3416), so the judge can say where each burst's
#               time went. Its own file, read for the burst section only, so no
#               burst confirm joins the startup bar's population. The drive,
#               freshness and archive wait for it to CLOSE (#3450): stopping one
#               tail silences every other tail on the Worker, so two never overlap.
#   drivers     the steady pass, for ten minutes, sized from the load bar
#               (LOAD_RUN_BOOKINGS_PER_MINUTE in src/lib/load-bar.ts, #3124): at 90
#               advisors the drivers together drive exactly the bar, and at 200 the
#               same rate per advisor (#3829). `steadyPacingFor` in book-plan.ts says
#               how many and how fast; at 70 a minute, five at fourteen at 90 and
#               twelve at 200. Each is its own runner and so its own address.
#   freshness   the existing soak sampler, one sample a minute, so recompute is
#               measured UNDER the load rather than before or after it.
#   archive     `wrangler tail` for the window, because observability's own
#               pipeline has been measured three hours behind and a run's logs are
#               worth having while somebody is still looking at the run.
#   fault       redeploys with a percentage of calls failing on the systems named
#               in fault_targets (calendar reads by default) and drives a short
#               second pass, which is the only leg that says whether the path
#               DEGRADES rather than 5xxing. Beside it the lane sampler reads the
#               branch's heartbeats and alert state for the whole faulted window,
#               so the judge scores the cron lanes rather than a person reading a
#               log (#3104). It comes last and alone, because the fault settings
#               are deployment wide: overlapping them with the steady pass would
#               make that pass's own 5xx bar a measurement of the faults this run
#               injected on purpose.
#   cold        a diagnostic, off unless cold_samples is above 0 (#3354): it deploys a
#               new version, waits for it to settle and sends ONE confirm, N times, so
#               each confirm is a fresh version's first request. A run's own cold
#               confirms number a handful to about twenty and the startup bar holds the slowest (#3824); this gives a
#               distribution to judge a startup change against. It runs after the
#               archive's tail has stopped and streams its own, so none of its confirms
#               join the startup bar's population. Reported, never a bar.
#   judge       reads all of it and writes ONE dated report.
#   teardown    runs only after the judge, so the evidence outlives the branch.
#
# Needs: LOADTEST_SUPABASE_URL / LOADTEST_SUPABASE_SECRET_KEY (the branch),
# LOADTEST_SUPABASE_PUBLISHABLE_KEY (the fault leg REBUILDS, and the publishable
# key is inlined at build time), LOADTEST_BOOKING_API_KEY, LOADTEST_CRON_SECRET,
# LOADTEST_BASE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# LOADTEST_WORKER_NAME. `pnpm check:workflow-settings` names any that do not exist
# with the command to create each.
#
# The seven LOADTEST_ ones are the exception, and this is what tells the checker so
# (#2293). CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are deliberately NOT in
# the list: they are permanent account credentials this run borrows, so a missing
# one is a real finding.
#
# settings-provisioned-per-run: LOADTEST_BASE_URL, LOADTEST_WORKER_NAME,
#   LOADTEST_BOOKING_API_KEY, LOADTEST_CRON_SECRET, LOADTEST_SUPABASE_URL,
#   LOADTEST_SUPABASE_SECRET_KEY, LOADTEST_SUPABASE_PUBLISHABLE_KEY
#   because each one is created by whoever dispatches a run, against a throwaway
#   Supabase branch the teardown job deletes and the load test Worker whose secrets
#   it takes (#3310), so between runs their absence is the normal state rather than
#   a misconfiguration. Every
#   script this workflow runs refuses an empty value BY NAME, so a run dispatched
#   before they are created stops rather than booking against production.
on:
  workflow_dispatch:
    inputs:
      fault_pct:
        description: Percentage of calls the fault pass fails, on the systems named in fault_targets
        type: string
        default: "10"
      fault_targets:
        description: >-
          Which systems the fault pass fails, comma separated: google-read,
          google-write, supabase, salesforce, webhook. The default is calendar reads
          alone, which keeps the no 5xx bar; naming google-write or supabase drops it,
          because a failure there is a 5xx by design (#3104).
        type: string
        default: "google-read"
      teardown:
        description: >-
          Take the load test Worker's secrets and delete the Supabase branch named
          in branch_name, when the judge is done. The Worker itself is kept, so
          the next run's crons are already arriving (#3310). With no branch_name
          the run says so rather than reporting a clean teardown over a branch
          that is still billing (#2322).
        type: boolean
        default: true
      branch_name:
        description: >-
          The throwaway Supabase branch this run drives (loadtest-<issue>). The
          teardown deletes it by name, refusing anything that is not a throwaway,
          is the project default, or points at the parent project. Leave empty and
          the branch is left standing, and the job says so.
        type: string
        default: ""
      post_confirm_recompute:
        description: >-
          Which arm of the post confirm slot recompute the deployment runs (#3258):
          on (production's behaviour), off (nothing scheduled after a booking), or
          reads-only (its reads with no compute and no write). Anything but on
          redeploys the Worker with that setting before the preflight, and the
          preflight refuses a deployment running another arm.
        type: choice
        options:
          - "on"
          - "off"
          - reads-only
        default: "on"
      cold_samples:
        description: >-
          How many cold samples the diagnostic cold leg takes (#3354), each one a
          redeploy followed by one confirm, at about a minute each. 0 skips the leg.
          30 is what a startup change is judged against, and the most it takes.
        type: string
        default: "0"
      google_delay:
        description: >-
          How long the Google stand in takes on the calls a lead waits on (#3490), as
          read=<p50>/<p95>,write=<p50>/<p95> in milliseconds, for example
          read=3000/5000,write=5000/8000. Empty (the default) is off: the stand in
          answers at once, as every run before this did. Anything else redeploys the
          Worker with it before the preflight, which refuses a deployment running
          another rig, and the report's header names it.
        type: string
        default: ""
      roster:
        description: >-
          Which checked in roster the branch was seeded with (#3829): 90 is
          production's, 200 is production's scaled to 200 advisors with the same mix
          by tier, backend and zone. The steady pass grows with it at the load bar's
          rate per advisor (five drivers at 90, twelve at 200, at 70 a minute); the
          bursts keep their size.
          The burst setup counts the seeded advisors and refuses a run whose count is
          not this roster.
        type: choice
        options:
          - "90"
          - "200"
        default: "90"
      burst_lead_seconds:
        description: >-
          How long the burst drivers have to be queued, checked out and installed
          before the shared moment. A driver that wakes late fires nothing and the
          judge fails the burst, so raise this rather than re-running. 600 covers
          the slowest runner start seen (395s, run 38912230442) plus a driver's own
          setup, held by scripts/test-loadtest-driver-deadline.ts.
        type: string
        default: "600"

# Never cancelled in flight. A half run leaves a seeded branch, a deployment and
# hundreds of bookings behind, and the next run would then be seeded on top of
# them: its overlap check would report clashes this one created.
concurrency:
  group: loadtest
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUN_ID: run-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # The post confirm recompute arm (#3258) and the Google delay (#3490). The steady
  # pass runs against the deployment the dispatcher made, which carries neither and
  # so runs on with no delay; anything else is a deployment wide setting, so it is
  # added here with `--var` exactly the way the fault leg adds its own, before the
  # preflight asks the deployment which arm and which delay it really runs. Its own job rather than steps in the preflight, because the
  # preflight's timeout is already spent on its warm up deadline
  # (test-loadtest-warmup.ts). The job always runs and skips its steps for on, so
  # the preflight's `needs` is never a skipped job.
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.post_confirm_recompute != 'on' || inputs.google_delay != ''
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.post_confirm_recompute != 'on' || inputs.google_delay != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.post_confirm_recompute != 'on' || inputs.google_delay != ''
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.post_confirm_recompute != 'on' || inputs.google_delay != ''
      - name: Stamp the commit this arm is deploying
        if: inputs.post_confirm_recompute != 'on' || inputs.google_delay != ''
        run: node --experimental-strip-types scripts/stamp-build-info.ts "$GITHUB_SHA"
      # The same build inputs the fault leg uses, for the same reason: they are
      # inlined at build time.
      - name: Build against the branch
        if: inputs.post_confirm_recompute != 'on' || inputs.google_delay != ''
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.LOADTEST_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LOADTEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LOADTEST_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com
        run: pnpm cf:build
      # #3500, #3555, #3512: the load test's CONFIRM_LINE, BURST_LIMITER and TOKEN_HOLDER bindings name these
      # workers by script, so they are deployed first, from the list the production deploy
      # uses (OBJECT_WORKER_CONFIGS), by the same code and the same rule (#3561): each one
      # only when its bundle or config differs from the version serving, since a deploy
      # restarts its objects. A retry after a partial failure skips what already landed.
      # The fault and cold legs redeploy only Slate, so the objects are not restarted
      # under them.
      - name: Deploy the object workers the load test binds
        if: inputs.post_confirm_recompute != 'on' || inputs.google_delay != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/loadtest/retry-cloudflare-api.sh node --experimental-strip-types scripts/deploy-object-workers.ts --env loadtest
      # `--var` MERGES with the vars block, so everything in env.loadtest survives
      # and only the arm and the Google delay are added. Nothing commits either
      # (scripts/test-wrangler-loadtest-env.ts refuses that). An empty delay adds no
      # setting at all rather than an empty one (#3490).
      - name: Deploy with the post confirm recompute arm and the Google delay
        if: inputs.post_confirm_recompute != 'on' || inputs.google_delay != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECOMPUTE_ARM: ${{ inputs.post_confirm_recompute }}
          GOOGLE_DELAY: ${{ inputs.google_delay }}
        run: |
          args=(--var "SLATE_LOADTEST_POST_CONFIRM_RECOMPUTE:$RECOMPUTE_ARM")
          delay="$(echo "$GOOGLE_DELAY" | tr -d '[:space:]')"
          if [ -n "$delay" ]; then args+=(--var "SLATE_LOADTEST_GOOGLE_DELAY:$delay"); fi
          bash scripts/loadtest/retry-cloudflare-api.sh npx wrangler deploy --env loadtest "${args[@]}"

  preflight:
    needs: arm
    runs-on: ubuntu-latest
    # Sixty (#2347, raised in #3229): the preflight WAITS for the scheduled
    # invocation to start reaching a freshly created Worker, then drives the
    # hydration lane by hand until every seeded calendar is covered. That first
    # delivery was about six minutes on 2026-09-15 and 27 on 2026-10-04, so its own
    # deadline (WARMUP_CRON_DELIVERY_DEADLINE_MS) is now 38 minutes. The control
    # booking can then wait twice for a fresh stored slot row
    # (ROW_FRESHNESS_DEADLINE_MS, 6 minutes each, #3236), and the rest pays for the
    # install, the hydration and recompute drives and the booking, so a slow
    # delivery ends in the preflight's own give up wording rather than a job
    # cancellation that says nothing. test-loadtest-warmup.ts fails if this drops
    # below the deadline plus both row waits plus ten. Sixty is also the ceiling
    # every job carries (scripts/test-workflow-timeouts.ts), which is what holds
    # the delivery deadline at 38.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Warm the deployment, then one booking and the judge's own overlap check
        env:
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          BOOKING_API_KEY: ${{ secrets.LOADTEST_BOOKING_API_KEY }}
          # The warm up drives /api/cron/hydrate-calendars and /api/cron/recompute
          # by hand (#2347), because hydration's own cadence is fifteen minutes at
          # twelve calendars a tick and a 93 agent roster is two hours away on it.
          CRON_SECRET: ${{ secrets.LOADTEST_CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.LOADTEST_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.LOADTEST_SUPABASE_SECRET_KEY }}
          # The arm this run was dispatched for (#3258); the preflight refuses a
          # deployment running any other.
          EXPECT_POST_CONFIRM_RECOMPUTE: ${{ inputs.post_confirm_recompute }}
          # The Google delay this run was dispatched with (#3490); the preflight
          # refuses a deployment running any other.
          EXPECT_GOOGLE_DELAY: ${{ inputs.google_delay }}
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/preflight.ts
      # The judge reads this to learn whether the unique index really enforces, so
      # it has to reach the judge like every other driver file.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight
          path: results/

  # The same day baseline (#3258): bookings at rest, one every ten seconds, on the
  # deployment and branch the steady pass is about to drive, and before anything else
  # loads them. Each runner's first two are a warm up the judge drops (#3517), and the
  # median is pooled over the seven each runner sends after them, twenty one in all
  # (#3914, below). The steady pass's p95 is judged against a multiple of
  # that median, because a bar fixed alone was judging the throwaway environment more
  # than the code (the 09-15 code measured 3.5s at the p95 on 09-15 and 7.0s on
  # 2026-10-04), AND against a fixed limit calibrated on the 200 advisor runs, so a slow
  # baseline cannot pass a slow run. See scripts/loadtest/latency-bar.ts. The timeout
  # covers one runner's deadline for its plan plus the turn it may wait for
  # (`baselineJobTimeoutMinutes`, held by scripts/test-loadtest-driver-deadline.ts).
  #
  # Spread across three runners (#3914), because ONE runner's address decided the whole
  # baseline: the per address limiter object it meets answered the median booking in
  # 215ms on run 39090439214 against 42 and 55ms on two runs of the same commit, while the
  # nine steady drivers' p50 did not move. Each runner is its own address and object, and
  # the judge pools the median over all three, as the steady p95 is pooled over its
  # drivers. They take turns on one ten second clock and never book one time, so the
  # deployment still sees one booking every ten seconds. The list below must match
  # `BASELINE_RUNNERS`; the same test holds it.
  #
  # Cost (#3914, measured against run 39093966606, whose baseline job took 3m13s of which
  # 27s was setup): each runner is about 30s of setup, up to 30s waiting for its turn and
  # 240s of bookings, so about five billed minutes each and fifteen for the leg, against
  # four or five for the one runner of #3517: about ten more billed minutes a run on
  # ubuntu-latest (1x). Three runner slots for those five minutes instead of one, at a
  # point in the run where nothing else is running, so the run's peak is unchanged. Wall
  # clock on the critical path: about a minute more, since the setup waits for the leg.
  baseline:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Never cancel a sibling: the judge names a runner whose file is missing, and a
      # runner cancelled by another's failure would read as missing for no reason of its own.
      fail-fast: false
      matrix:
        driver: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Book at rest, after a warm up
        env:
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          BOOKING_API_KEY: ${{ secrets.LOADTEST_BOOKING_API_KEY }}
          MODE: baseline
          DRIVER: ${{ matrix.driver }}
          OUT: results/baseline-${{ matrix.driver }}.json
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/book.ts
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-${{ matrix.driver }}
          path: results/

  # The burst leg runs BEFORE the steady pass and alone, which is a decision rather
  # than an ordering accident. The steady mix includes the burst ladders' codes (it
  # is real traffic), so a steady driver that happened to take a burst's slot first
  # would turn burst requests into SLOT_TAKEN for a reason that has nothing to do with
  # contention, and would change the capacity the setup measured for the burst
  # (#3429). A crowd on one slot is the contention being measured either way.
  setup-burst:
    # After the baseline, so its bookings are made at rest (#3258). Whatever the
    # baseline concluded: a failed baseline leaves no file, which the judge reports
    # as an UNMEASURED speed verdict while judging every other bar (Dan,
    # 2026-10-05), so it must not cost the rest of the run.
    needs: [preflight, baseline]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # ONE value (#3325, #3429): every burst's kind, codes, slot, moment, share and
      # measured capacity, so the four drivers cannot fire at different codes, slots
      # or moments while each reads as correct (L70). What each burst was worth
      # travels inside it to the drivers' files and from there to the report.
      burst_plan: ${{ steps.pick.outputs.burst_plan }}
      # Emitted from the app's own BURST_LEGS, so the plan and the judge's
      # expectation are one number.
      burst_count: ${{ steps.pick.outputs.burst_count }}
      # Emitted from the app's own DRIVERS constant, so the matrix below and the
      # judge's expectation are ONE number rather than two that drift (L41).
      drivers: ${{ steps.pick.outputs.drivers }}
      driver_count: ${{ steps.pick.outputs.driver_count }}
      # #3829: the STEADY drivers, sized from the roster this step counted on the
      # branch, so the drive matrix and the judge's expectation are one number too.
      steady_drivers: ${{ steps.pick.outputs.steady_drivers }}
      steady_driver_count: ${{ steps.pick.outputs.steady_driver_count }}
      roster_advisors: ${{ steps.pick.outputs.roster_advisors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ONE plan, chosen here and handed to every driver: each burst's kind, codes,
      # slot, moment and share. It refuses on its own exit code for every way of
      # learning nothing, because an empty burst file and a run with no burst leg are
      # otherwise the same thing: no two codes sharing a fallback ladder (6), no
      # ladder smaller than the refusal crowd (7), none that can host the drop burst
      # (8), no slot where the drop burst fits (9) (#3325, #3429; RUNBOOK lists all).
      - name: Pick the burst's codes, slots and moments
        id: pick
        env:
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          BURST_LEAD_SECONDS: ${{ inputs.burst_lead_seconds }}
          # Which roster the branch should hold (#3829); a different count refuses.
          ROSTER: ${{ inputs.roster }}
          # The roster and who is free at a slot, so every ladder the bursts fire at
          # is MEASURED rather than a hand maintained constant (#2278, #3429). Without
          # these the step refuses on its own exit code rather than guessing.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LOADTEST_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.LOADTEST_SUPABASE_SECRET_KEY }}
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/burst-setup.ts

  burst:
    needs: setup-burst
    # #3431: setup-burst runs after a FAILED baseline on purpose, and a job that needs
    # it with no condition of its own would still be skipped behind that baseline: the
    # default success() is false when ANY ancestor failed (L754). Named the same way
    # as the burst tail's, so the drivers and the stream that records them run or not
    # together.
    if: ${{ !cancelled() && needs.setup-burst.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Never cancel a sibling. Four drivers firing together IS the burst, and a
      # burst missing one fails the burst bar rather than passing as a smaller burst.
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.setup-burst.outputs.drivers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A driver that wakes after the grace window for one burst fires nothing for
      # THAT burst and says so, in that burst's file, then fires the others and exits
      # non-zero (#3325). A late request meets an already taken slot and records a
      # SLOT_TAKEN indistinguishable from the contention the control is counting, so
      # the judge would be handed a staggered burst wearing a simultaneous one's
      # clothes. One file per burst (burst-N-leg-K.json), so a miss costs one burst.
      - name: Fire at each shared moment
        env:
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          BOOKING_API_KEY: ${{ secrets.LOADTEST_BOOKING_API_KEY }}
          MODE: burst
          DRIVER: ${{ matrix.driver }}
          BURST_PLAN: ${{ needs.setup-burst.outputs.burst_plan }}
          OUT: results/burst-${{ matrix.driver }}.json
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/book.ts
      # ALWAYS uploaded: a driver that missed its moment wrote a file saying so, and
      # that file is what tells the judge the burst was not simultaneous. Without it
      # the judge sees a burst leg that produced nothing.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burst-${{ matrix.driver }}
          path: results/

  # The bursts' own log (#3416). The archive below needs the burst job, so its tail
  # starts after the bursts, and on run 37520312761 no burst confirm's log line was
  # kept: every confirm took about ten seconds and nobody could say which stage took
  # it. This starts beside the burst drivers, from the same plan, so it is streaming
  # before the first shared moment (the default lead, `burst_lead_seconds`), and stops at a moment
  # DERIVED from the plan's last one (`burstTailStopAtMs` in book-plan.ts: a driver's
  # lateness, a request's own abort bound, the work allowed after an answer, the
  # stream's lag), never a constant.
  #
  # Its own file, read by the judge for the burst section only. A crowd on one slot
  # is a different load shape, so its confirms must not join the startup bar's
  # population, which the archive's tail alone feeds; the cold leg's tail is kept out
  # of it the same way.
  burst-tail:
    needs: setup-burst
    if: ${{ !cancelled() && needs.setup-burst.result == 'success' }}
    runs-on: ubuntu-latest
    # The ceiling below plus the runner's setup. scripts/test-loadtest-burst-tail.ts
    # holds the ceiling at or above `burstTailMinutesNeeded` at the default lead, and
    # this at or above the ceiling plus the setup.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The cold job's pattern, and for its reasons. `setsid` makes the tail its own
      # process group, so the stop reaches wrangler itself rather than only the
      # `timeout` wrapping it, which would leave the stream holding the step open
      # (L321). The ceiling is a backstop for a stop that never comes. Nothing waits
      # for the tail to connect: in json format wrangler prints no "Connected" line.
      # stderr goes to its own file so the stream holds only events, and the wait's
      # exit is kept so a refusal still stops the tail before the step ends.
      - name: Stream the Worker's logs across every burst
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BURST_PLAN: ${{ needs.setup-burst.outputs.burst_plan }}
          BURST_TAIL_CEILING_MINUTES: "14"
        run: |
          mkdir -p results
          setsid timeout "${BURST_TAIL_CEILING_MINUTES}m" npx wrangler tail --env loadtest --format json > results/burst-tail.jsonl 2> results/burst-tail.err &
          tail_pid=$!
          rc=0
          node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/burst-tail-wait.ts || rc=$?
          kill -TERM -- -"$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          wc -l results/burst-tail.jsonl
          exit "$rc"
      # ALWAYS: a tail that could not cover every burst still holds what it caught,
      # and the judge reports which requests it matched.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burst-tail
          path: results/

  drive:
    needs: [preflight, setup-burst, burst, burst-tail]
    # Also waits for the burst tail (#3450): stopping one `wrangler tail` silences
    # every other tail on the Worker, so the archive must not open until the burst
    # tail has closed, and the drive and freshness wait with it so the archive still
    # records the drive from its first request. `!cancelled()` below means a failed
    # burst tail never skips this.
    # Runs whatever the BURST concluded (#3222). A job with `needs:` and no `if:` is
    # skipped when any ancestor did not succeed, and a burst driver that wakes late
    # exits 3 by design, so one late driver used to skip the steady pass, freshness
    # and the archive, and with them the ceiling and the fault pass: the run was
    # INCOMPLETE with nothing driven. The judge fails the burst with its reason
    # instead. The preflight and the burst setup must still have succeeded, named
    # explicitly because `!cancelled()` replaces the implicit success check.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.setup-burst.result == 'success' }}
    runs-on: ubuntu-latest
    # DERIVED, not chosen (#3222): `driveJobTimeoutMinutes` in book-plan.ts, the
    # driver's own deadline (the slowest passing plan, every request at the latency
    # bar, held at three quarters of it, about twenty one minutes at fourteen a
    # minute, #3163) plus the runner's setup and one in flight request's grace. The
    # plan is one driver's share of the load bar (#3124), so raising the bar moves it.
    # scripts/test-loadtest-driver-deadline.ts holds this number equal to it. A slow
    # driver stops at its deadline, writes what it ran and exits zero, so the judge
    # FAILS the run with figures and the ceiling and fault legs still run; only a
    # genuinely hung driver ever meets this timeout, and its missing file says so.
    timeout-minutes: 26
    strategy:
      # Never cancel a sibling: the drivers together ARE the load, and a run missing
      # one is judged as incomplete rather than as a slower run. How many comes from
      # the load bar and the roster the setup counted (#3124, #3829).
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.setup-burst.outputs.steady_drivers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drive the booking API
        env:
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          BOOKING_API_KEY: ${{ secrets.LOADTEST_BOOKING_API_KEY }}
          DRIVER: ${{ matrix.driver }}
          OUT: results/driver-${{ matrix.driver }}.json
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/book.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driver-${{ matrix.driver }}
          path: results/

  freshness:
    needs: [preflight, setup-burst, burst, burst-tail]
    # Also waits for the burst tail (#3450): stopping one `wrangler tail` silences
    # every other tail on the Worker, so the archive must not open until the burst
    # tail has closed, and the drive and freshness wait with it so the archive still
    # records the drive from its first request. `!cancelled()` below means a failed
    # burst tail never skips this.
    # Runs whatever the BURST concluded (#3222). A job with `needs:` and no `if:` is
    # skipped when any ancestor did not succeed, and a burst driver that wakes late
    # exits 3 by design, so one late driver used to skip the steady pass, freshness
    # and the archive, and with them the ceiling and the fault pass: the run was
    # INCOMPLETE with nothing driven. The judge fails the burst with its reason
    # instead. The preflight and the burst setup must still have succeeded, named
    # explicitly because `!cancelled()` replaces the implicit success check.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.setup-burst.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sample recompute freshness once a minute, under the load
        env:
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          CRON_SECRET: ${{ secrets.LOADTEST_CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.LOADTEST_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.LOADTEST_SUPABASE_SECRET_KEY }}
          OUT: results/freshness.json
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/freshness-sampler.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freshness
          path: results/

  # AFTER the steady pass, not alongside it (#2339). The control now sends past the
  # per address HOURLY cap, which is the only per address bound that really
  # refuses, and the per KEY ceiling is checked FIRST and returns before the per
  # address one is reached. Run concurrently with the drivers, the two would share
  # one key's budget: the control could trip the key ceiling and never reach the
  # ceiling it exists to prove, and the drivers would be throttled by it.
  ceiling:
    needs: drive
    # On the drive job's OWN success (#3222). Without an `if:` this is skipped
    # whenever any ancestor failed, a late burst driver included, even though the
    # drive itself ran.
    if: ${{ !cancelled() && needs.drive.result == 'success' }}
    runs-on: ubuntu-latest
    # Long enough for the whole budget at the paced rate. The ordinary case stops at
    # the first per address refusal and takes a couple of minutes; a deployment
    # where nothing tighter than the hourly cap refuses pays the whole thing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Its own step, and its own address budget. It sends until the deployment
      # CREDITS a refusal to the per address ceiling, up to past the exact hourly
      # cap, so the run always reaches a verdict. Without it, every 429 the run
      # attributes is a number nobody has shown that ceiling can produce.
      - name: Prove the per address write ceiling applies
        env:
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          BOOKING_API_KEY: ${{ secrets.LOADTEST_BOOKING_API_KEY }}
          OUT: results/ip-ceiling.json
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/ip-ceiling-control.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ip-ceiling
          path: results/

  archive:
    needs: [preflight, setup-burst, burst, burst-tail]
    # Also waits for the burst tail (#3450): stopping one `wrangler tail` silences
    # every other tail on the Worker, so the archive must not open until the burst
    # tail has closed, and the drive and freshness wait with it so the archive still
    # records the drive from its first request. `!cancelled()` below means a failed
    # burst tail never skips this.
    # Runs whatever the BURST concluded (#3222). A job with `needs:` and no `if:` is
    # skipped when any ancestor did not succeed, and a burst driver that wakes late
    # exits 3 by design, so one late driver used to skip the steady pass, freshness
    # and the archive, and with them the ceiling and the fault pass: the run was
    # INCOMPLETE with nothing driven. The judge fails the burst with its reason
    # instead. The preflight and the burst setup must still have succeeded, named
    # explicitly because `!cancelled()` replaces the implicit success check.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.setup-burst.result == 'success' }}
    runs-on: ubuntu-latest
    # DERIVED (#3222): `archiveJobTimeoutMinutes` in book-plan.ts, the tail
    # window below plus the runner's setup, held equal by
    # scripts/test-loadtest-driver-deadline.ts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Streamed live rather than queried afterwards: the observability pipeline has
      # been measured three hours behind (#1533), so a run's own logs would not be
      # readable while anybody is still looking at the run.
      #
      # The window is `archiveTailMinutes` (#3222): one minute past the longest a
      # drive job can run, since a slow drive now legitimately takes its whole
      # deadline. A fixed fifteen minutes lost a slow run's last lines.
      #
      # The burst tail's and the cold job's pattern, and for their reasons (#3463).
      # `timeout` alone signals only `npx`, and `wrangler` beneath it outlived it on
      # run 37566700055: the step ran 36 minutes past its 29 minute window until the
      # job was cancelled, and the upload never ran. So the tail is its own process
      # group (`setsid`), the step waits out the window itself and then stops the
      # whole group, and the `timeout` one minute later is only the backstop. stderr
      # goes to its own file so the stream holds only events.
      #
      # #3781: the confirm line Worker is tailed too, into `line-tail.jsonl`. Since
      # #3500 the line object runs in that Worker, so its traced calls are logged
      # there and never in the app's tail, and the judge could join none of them
      # (run 38833395446: 0 of 537). Its own process group and its own stop, so
      # neither tail outlives the window. No other job tails that Worker, so stopping
      # it silences nothing else (#3450).
      - name: Archive the Worker's logs for the window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_TAIL_MINUTES: "27"
        run: |
          mkdir -p results
          setsid timeout "$((ARCHIVE_TAIL_MINUTES + 1))m" npx wrangler tail --env loadtest --format json > results/tail.jsonl 2> results/tail.err &
          tail_pid=$!
          setsid timeout "$((ARCHIVE_TAIL_MINUTES + 1))m" npx wrangler tail -c wrangler.confirm-line.jsonc --env loadtest --format json > results/line-tail.jsonl 2> results/line-tail.err &
          line_tail_pid=$!
          sleep "$((ARCHIVE_TAIL_MINUTES * 60))"
          kill -TERM -- -"$tail_pid" 2>/dev/null || true
          kill -TERM -- -"$line_tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          wait "$line_tail_pid" 2>/dev/null || true
          wc -l results/tail.jsonl results/line-tail.jsonl
      # ALWAYS: a step that hangs or fails still holds what it caught, and the judge
      # says what the archive could and could not cover.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tail
          path: results/

  # The only leg that says whether the path DEGRADES rather than 5xxing.
  #
  # It runs LAST and ALONE, and it redeploys, because `SLATE_LOADTEST_FAULT_PCT` is
  # a deployment wide setting rather than a per request one: there is no way to
  # fault one leg of a run without faulting the deployment, and overlapping it with
  # the steady pass would make that pass's own "no 5xx" bar a measurement of the
  # faults this run injected on purpose.
  #
  # The redeploy is the cost of that, and it is made honest rather than assumed: the
  # driver asks `/api/smoke/version` whether the deployment is really running the
  # percentage AND the commit this job just deployed, and refuses before sending a
  # single request when it is not. A deployment that never received the setting
  # fails no reads at all, answers everything perfectly, and would satisfy the bar
  # with no fault having happened (L98).
  fault:
    needs: [drive, burst, freshness, ceiling]
    # Whatever the burst concluded, for the same reason as the drive job (#3222);
    # the legs it really follows must each have succeeded.
    if: ${{ !cancelled() && needs.drive.result == 'success' && needs.freshness.result == 'success' && needs.ceiling.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stamped so the commit the driver checks against is a real value rather than
      # the "dev" placeholder every unstamped build carries, which would match any
      # other unstamped build and prove nothing about this deploy.
      - name: Stamp the commit this leg is deploying
        run: node --experimental-strip-types scripts/stamp-build-info.ts "$GITHUB_SHA"
      # The same build inputs the deployment was made with. They are inlined at
      # build time (src/lib/env.ts reads each by its literal name), so a build with
      # production's values here would be refused at runtime by the load test guard
      # and a build with the wrong app URL would namespace the L1 slot caches
      # differently from the pass that just ran.
      - name: Build against the branch
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.LOADTEST_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LOADTEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LOADTEST_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com
        run: pnpm cf:build
      # `--var` MERGES with the vars block rather than replacing it, so the load
      # test flag, the disabled lanes and every other setting in env.loadtest
      # survive this deploy. Only the two fault settings are added, and nothing
      # commits either (scripts/test-wrangler-loadtest-env.ts refuses that).
      # Every wrangler deploy here goes through retry-cloudflare-api.sh (#3567): one 504
      # from Cloudflare's own API ruled load run 37970129958 INCOMPLETE after its whole load.
      - name: Deploy with a share of calls failing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAULT_PCT: ${{ inputs.fault_pct }}
          FAULT_TARGETS: ${{ inputs.fault_targets }}
          # The run's own arm (#3258) and Google delay (#3490), carried so the fault
          # pass runs the same rig. An empty delay adds no setting.
          RECOMPUTE_ARM: ${{ inputs.post_confirm_recompute }}
          GOOGLE_DELAY: ${{ inputs.google_delay }}
        run: |
          args=(--var "SLATE_LOADTEST_FAULT_PCT:$FAULT_PCT"
            --var "SLATE_LOADTEST_FAULT_TARGETS:$FAULT_TARGETS"
            --var "SLATE_LOADTEST_POST_CONFIRM_RECOMPUTE:$RECOMPUTE_ARM")
          delay="$(echo "$GOOGLE_DELAY" | tr -d '[:space:]')"
          if [ -n "$delay" ]; then args+=(--var "SLATE_LOADTEST_GOOGLE_DELAY:$delay"); fi
          bash scripts/loadtest/retry-cloudflare-api.sh npx wrangler deploy --env loadtest "${args[@]}"
      # The lane sampler runs BESIDE the driver, from before the driver's first
      # request to a tail of minutes after its last (#3104). The deployment stays
      # faulted until the restore below, so the tail is still faulted time, and it
      # is what gives the sync page its two consecutive failing ticks. The sampler
      # is told the driver is done by a file rather than killed, so it always
      # writes what it saw; it stops on its own ceiling regardless. Both exit codes
      # are kept, the driver's first, so a refusing driver still fails the step.
      - name: Drive a short pass against it, sampling the cron lanes
        env:
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          BOOKING_API_KEY: ${{ secrets.LOADTEST_BOOKING_API_KEY }}
          SUPABASE_URL: ${{ secrets.LOADTEST_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.LOADTEST_SUPABASE_SECRET_KEY }}
          MODE: fault
          DRIVER: 0
          FAULT_PCT: ${{ inputs.fault_pct }}
          FAULT_TARGETS: ${{ inputs.fault_targets }}
          FAULT_COMMIT: ${{ github.sha }}
          OUT: results/fault-0.json
        run: |
          mkdir -p results
          STOP_FILE=results/.fault-driver-done OUT=results/fault-lanes.json \
            node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/fault-lane-sampler.ts &
          sampler=$!
          driver_rc=0
          node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/book.ts || driver_rc=$?
          touch results/.fault-driver-done
          sampler_rc=0
          wait "$sampler" || sampler_rc=$?
          if [ "$driver_rc" -ne 0 ]; then exit "$driver_rc"; fi
          exit "$sampler_rc"
      # ALWAYS, and before the artifact, because a deployment left injecting faults
      # is the one thing this leg can leave behind that outlives the run: a later
      # run dispatched with teardown off would have its steady pass count those
      # faults as the path's own 5xx. No `--var`, so it ships exactly the vars block
      # in env.loadtest, and no rebuild, since the build from three steps up is
      # still on disk. The preflight also refuses a deployment still reporting a
      # fault percentage, so a restore that itself fails is caught rather than
      # inherited.
      - name: Put the deployment back to injecting nothing
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/loadtest/retry-cloudflare-api.sh npx wrangler deploy --env loadtest
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fault-0
          path: results/

  # #3354 item 4: the diagnostic cold leg. Off unless cold_samples is above 0.
  #
  # It deploys a new version, waits for it to settle and sends ONE confirm, N times,
  # so each confirm is a fresh version's first request (scripts/loadtest/cold-plan.ts).
  # It waits for the archive, so the main tail has stopped and none of its confirms
  # join the startup bar's population, and for the fault leg, which redeploys too. It
  # streams its OWN tail as cold-tail.jsonl, which the judge reads apart.
  cold:
    needs: [preflight, archive, fault]
    if: ${{ !cancelled() && inputs.cold_samples != '0' && inputs.cold_samples != '' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    # DERIVED: `coldJobTimeoutMinutes(COLD_SAMPLES_MAX)` in cold-plan.ts, held equal by
    # scripts/test-loadtest-cold-plan.ts. An expression cannot compute it from the
    # input, so it is the ceiling for the most samples the leg takes.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The `if:` above can only compare strings, so a value the leg would refuse ("31",
      # "00") still starts this job. Checked on bare node before the install and build.
      - name: Check cold_samples before installing anything
        env:
          COLD_SAMPLES: ${{ inputs.cold_samples }}
        run: node --experimental-strip-types scripts/loadtest/check-cold-samples.ts
      - run: pnpm install --frozen-lockfile
      # The same stamp and build inputs as the fault leg, so every version this leg
      # deploys is the bundle the run measured.
      - name: Stamp the commit this leg is deploying
        run: node --experimental-strip-types scripts/stamp-build-info.ts "$GITHUB_SHA"
      - name: Build against the branch
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.LOADTEST_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LOADTEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LOADTEST_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com
        run: pnpm cf:build
      # The tail is started before the first deploy and stopped once the last
      # confirm's lines have had time to arrive. `setsid` makes it its own process
      # group, so the stop reaches wrangler itself rather than only the `timeout`
      # wrapping it, which would leave the stream holding the step open (L321).
      - name: Deploy and confirm, one sample at a time, under the leg's own tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLATE_BASE: ${{ vars.LOADTEST_BASE_URL }}
          BOOKING_API_KEY: ${{ secrets.LOADTEST_BOOKING_API_KEY }}
          COLD_SAMPLES: ${{ inputs.cold_samples }}
          # The run's own arm (#3258) and Google delay (#3490), kept on every version
          # this leg deploys.
          RECOMPUTE_ARM: ${{ inputs.post_confirm_recompute }}
          GOOGLE_DELAY: ${{ inputs.google_delay }}
          OUT: results/cold-0.json
        run: |
          mkdir -p results
          setsid timeout 58m npx wrangler tail --env loadtest --format json > results/cold-tail.jsonl 2> results/cold-tail.err &
          tail_pid=$!
          # No wait for the tail to connect: in json format wrangler prints no
          # "Connected" line (it does only in pretty format), so there is nothing to
          # wait on, and the leg's slot reads plus its first deploy (about 20s) plus
          # the settle come before the first confirm anyway.
          rc=0
          node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/cold-after-deploy.ts || rc=$?
          # The last confirm's events reach the stream a few seconds after it answers.
          sleep 30
          kill -TERM -- -"$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          wc -l results/cold-tail.jsonl
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-0
          path: results/

  judge:
    # `preflight` is here only so this job can SAY the environment is still
    # standing when the preflight refused (#2347); every other leg already depends
    # on it, so it adds no ordering.
    needs: [preflight, baseline, setup-burst, drive, burst, burst-tail, freshness, ceiling, archive, fault, cold]
    # Judged even when a driver failed: the judge's own job is to say the run was
    # incomplete, and skipping it would leave that unsaid.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded
      # `if: always()` on the download above means `downloaded/` may not exist at
      # all: a run whose preflight failed uploaded nothing. `find` on a missing
      # directory exits non-zero, which failed this step under `bash -e` and took
      # the judge with it, so the run that most needed a verdict got none and said
      # only "No such file or directory" (L98). The judge's own job is to say the
      # run was incomplete; it cannot do that if a shell step kills it first.
      # `.jsonl` as well as `.json` (#2340): the archived Worker log is
      # `tail.jsonl`, and the judge reads it to tell a confirm's own time apart
      # from the isolate starting up. It was excluded by the glob, so the judge had
      # never once seen the artifact the run was already archiving.
      - name: Gather every driver's file into one directory
        run: |
          mkdir -p results downloaded
          find downloaded \( -name '*.json' -o -name '*.jsonl' \) -exec cp {} results/ \;
          echo "the evidence this run produced:"
          ls -la results/
      - name: Judge
        env:
          RESULTS: results
          SUPABASE_URL: ${{ secrets.LOADTEST_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.LOADTEST_SUPABASE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOADTEST_WORKER_NAME: ${{ vars.LOADTEST_WORKER_NAME }}
          # Which legs this run was CONFIGURED to have. Without them the judge
          # cannot tell "this run had no burst leg" from "the burst leg ran and its
          # artifact never got here", and publishes a report with its most
          # important control quietly absent (L98). Both are literals here because
          # this workflow always runs both; a hand run passes neither. The driver
          # count comes from the setup step, which emits it from the app's own
          # constant, so it can never disagree with the matrix that fired.
          EXPECT_BURST_DRIVERS: ${{ needs.setup-burst.outputs.driver_count }}
          # The steady drivers and the roster they were sized from (#3829), from the
          # same setup step as the matrix that fired them.
          EXPECT_STEADY_DRIVERS: ${{ needs.setup-burst.outputs.steady_driver_count }}
          EXPECT_ROSTER_ADVISORS: ${{ needs.setup-burst.outputs.roster_advisors }}
          # How many bursts the plan held (#3325), from the same setup step, so a
          # burst whose files never arrived fails by name rather than reading as a
          # run that fired fewer.
          EXPECT_BURSTS: ${{ needs.setup-burst.outputs.burst_count }}
          EXPECT_FAULT_PCT: ${{ inputs.fault_pct }}
          EXPECT_FAULT_TARGETS: ${{ inputs.fault_targets }}
          # This workflow always runs the same day baseline (#3258), so the latency
          # bar is the multiple of its median; a hand run passes nothing and keeps the
          # fixed bar.
          EXPECT_BASELINE: "1"
          # The post confirm recompute arm, named in the report's header (#3258).
          EXPECT_POST_CONFIRM_RECOMPUTE: ${{ inputs.post_confirm_recompute }}
          # And the Google delay, so a run with Google time is never read against one
          # without (#3490).
          EXPECT_GOOGLE_DELAY: ${{ inputs.google_delay }}
          # How many cold samples the diagnostic leg was asked for (#3354), so the
          # report can tell "not asked for" from "asked for and never arrived".
          EXPECT_COLD_SAMPLES: ${{ inputs.cold_samples }}
          # The lanes env.loadtest holds back, so the judge knows which lanes should
          # have kept running under fault without reading wrangler.jsonc itself (#3104).
          # A copy, held equal to wrangler's resolved value by scripts/test-fault-lanes.ts.
          EXPECT_LANES_DISABLED: advisor-photos,agents,bulk-reassign,busy-minutes,erasure-audit,monitor,ooo-approvals,ooo-digest,prune-bookings-pii,prune-warehouse-pii,snowflake-export,snowflake-reconcile
          # What each burst was worth (#2278) is no longer handed over here: since
          # #3429 the plan carries each burst's measured capacity into the drivers'
          # own files, and the report reads it from there.
          REPORT: reports/loadtest-${{ github.run_id }}.md
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/run-judge.ts
      # ALWAYS uploaded, and this is the step teardown waits on. A report that
      # exists only in a log is one nobody reads after the branch is gone.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loadtest-report
          path: reports/
      # A skipped teardown is only visible as a grey box in the run graph, which
      # reads the same as a step that was never configured. Say it in words, where
      # the reader already is (#2347).
      - if: always() && needs.preflight.result == 'failure'
        name: Say the deployment is still standing
        run: |
          {
            echo "## The preflight refused, so nothing was torn down"
            echo
            echo "The load test Worker still holds this run's secrets and the Supabase branch"
            echo "is still there. Nothing was measured, so there is nothing to keep: read the"
            echo "preflight job's own message, fix what it names, and dispatch this workflow"
            echo "again against the same deployment. Nothing needs provisioning again."
          } >> "$GITHUB_STEP_SUMMARY"

  teardown:
    needs: [judge, preflight]
    # Only after the judge has run AND uploaded, whatever it concluded. A teardown
    # that raced the judge would delete the branch the judge reads from.
    #
    # And NOT when the preflight refused (#2347). A preflight refusal means nothing
    # was measured: the run never booked anything, so there is no evidence for the
    # teardown to outlive, and deleting the branch and taking the Worker's secrets
    # costs about fifteen minutes to provision again before the same dispatch can be
    # tried. That
    # is exactly what happened on 2026-09-15, when a preflight that failed on a
    # cold cache forty seconds after the deploy tore down the environment it was
    # about to test. The deployment is left standing to be re-dispatched, and the
    # judge's summary says so; it still tears down after a run the preflight
    # PASSED, whatever the judge concluded.
    if: always() && inputs.teardown && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # #3310: the Worker is KEPT, and only its secrets are taken. Cloudflare has taken 27
      # to 105 minutes to deliver the first cron to a newly created Worker, and deleting
      # it here is what made every run's deploy a new one, so every run waited for its
      # lanes and a slow delivery lost the run. A kept Worker goes on receiving its
      # crons; with none of its secrets the entry answers nothing and runs no lane
      # (loadtestIdle), and with the branch deleted below it has nothing left to reach.
      #
      # The step deletes by Worker name, so it first checks the configured name is the
      # Worker `wrangler deploy --env loadtest` deploys, read from wrangler.jsonc, and
      # never production's. Idle is then confirmed by READS, never by the deletes'
      # answers: the secrets listing again, trusted only when positively readable, and
      # the cron schedules, because a kept Worker with none bought nothing. Every
      # outcome has its own exit code, driven offline in
      # scripts/test-loadtest-idle-worker.ts.
      - name: Take the Worker's secrets and confirm it is idle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOADTEST_WORKER_NAME: ${{ vars.LOADTEST_WORKER_NAME }}
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/keep-worker-idle.ts
      # THE BRANCH, which this job claimed to delete for months and never touched
      # (#2322). A Supabase branch is billed while it exists, and the 2026-09-14 run
      # left `loadtest-2284` ACTIVE_HEALTHY for twenty minutes past a teardown that
      # reported success: a success report about work never attempted (L98).
      #
      # `if: always()`, so a Worker whose secrets would not delete does not leave the
      # branch standing as well. They are two separate resources and one failing says
      # nothing about the other.
      #
      # Every refusal is its own exit code and every decision is pinned offline in
      # scripts/test-loadtest-branch-teardown.ts, because the dangerous part is
      # choosing which branch may be deleted and that must be testable with no
      # token. The live project carries a branch named `main` flagged as the
      # default, and the same API path one slash shorter DISABLES preview branching
      # for the whole project.
      - name: Delete the branch
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The parent project, written out rather than referenced as a repo
          # variable, matching ci.yml: it is not a secret, and a variable would be
          # one more setting to create before this can ever run. It is ALSO what the
          # refusals compare against, so a branch row pointing at it is refused.
          SUPABASE_PROJECT_REF: drukfvgaynzrralbzkzj
          LOADTEST_BRANCH: ${{ inputs.branch_name }}
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/loadtest/delete-branch.ts
