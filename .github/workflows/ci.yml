name: CI

# `push` is restricted to main; PR branches are covered by `pull_request` (#602).
# An unfiltered `push:` alongside `pull_request:` ran the ENTIRE pipeline twice on
# every PR commit (typecheck + lint + ~126 node suites + vitest + the full OpenNext
# build, all of it, twice). The push trigger still has to fire on main, because the
# deploy job is gated on a push to main.
on:
  push:
    branches:
      - main
  pull_request:

# Supersede an in-flight run when a newer commit lands on the same ref, so pushing a
# fix-up to a PR doesn't leave the previous run grinding through a Cloudflare build
# nobody is waiting for.
#
# NEVER on main: a run on main IS the production deploy, so cancelling one could
# interrupt a deploy mid-flight and leave the live Worker on a half-shipped state.
# Runs on main always go to completion. Pinned by scripts/test-ci-workflow.ts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # #1592: the pipeline runs as three independent legs in parallel behind the
  # `ci` fan-in below. Nothing here depended on anything else in it: the serial
  # job was 5m15s to 5m45s of wall time on every PR and again on every merge,
  # for about 2m35s of real work on the longest leg. Billed minutes stay roughly
  # flat (the same work, plus two extra installs); what drops is the time a PR
  # and a deploy spend waiting.
  #
  # The legs are NOT named `ci`. Exactly one check carries that name (the fan-in),
  # because main-push-guard.yml resolves whether a merge was green by selecting
  # check runs literally named `ci`, and several checks under that one name would
  # have it judging a set rather than a verdict. Pinned by
  # scripts/test-ci-workflow.ts.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fail the build on a NEW high (or critical) advisory in a production
      # dependency (#1026). Known, unremediated advisories are allow-listed in
      # package.json pnpm.auditConfig.ignoreGhsas and tracked in #1057, so this
      # gate stays green today but fires the moment something new lands, instead
      # of a Next.js-style lag where nothing was watching. --prod scopes it to
      # what actually ships to the Worker (dev-only advisories don't gate merges).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # The node suite only. `pnpm test` runs this AND vitest, which is what the
      # pre-push gate wants locally; here vitest is its own leg, so this job runs
      # the node half directly rather than waiting on the slower one.
      - name: Unit tests (node suites)
        run: pnpm test:node

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Component and route tests (vitest)
        run: pnpm test:components

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (Cloudflare / OpenNext)
        run: pnpm cf:build
        env:
          # Build-time NEXT_PUBLIC_* inlining only; no real secrets needed.
          NEXT_PUBLIC_APP_URL: https://slate.trypennie.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com

  # The fan-in, and the ONLY check anything outside this file reads.
  #
  # `if: always()` is load bearing rather than defensive. Without it a failed leg
  # SKIPS this job, and a skipped check is not a failed one: main-push-guard's jq
  # scores it "null" (unknown), which the classifier deliberately tolerates, so a
  # red PR would merge with the backstop saying nothing. With always(), the job
  # runs whatever the legs did and turns their results into a real conclusion.
  #
  # The results are read from `needs.*.result` rather than named one by one, so a
  # leg added to `needs` is judged without anyone remembering to edit this step
  # (L41). Anything other than `success` fails: a cancelled or skipped leg is not
  # a pass.
  ci:
    needs: [checks, vitest, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every CI leg succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "leg results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "::error::The CI fan-in read no leg results at all, so it has verified nothing. Failing rather than passing green."
            exit 1
          fi
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A CI leg did not succeed (results: $RESULTS). Open the run and look at the red leg."
              exit 1
            fi
          done
          echo "All CI legs succeeded."

  # Report-only merged coverage across both harnesses (#603). Its own job so it
  # never gates merge: a hard threshold on this mixed harness would be noisy. The
  # summary prints in the log and the lcov is uploaded as an artifact.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Merged coverage report
        run: pnpm test:coverage
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  # Fails if a committed migration hasn't been applied to the linked project, so
  # code can't merge expecting schema that isn't pushed. REQUIRES the
  # SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD repo secrets: without them the job
  # fails loudly rather than passing green while checking nothing (#766).
  #
  # SKIPPED on dependabot/* PR branches. Dependabot runs never receive the repo
  # secrets (GitHub withholds them from the dependabot context), so this job can
  # only false-fail there, forcing a manual recreate-on-a-normal-branch dance to
  # merge a routine bump. Dependabot only edits package.json / lockfiles / Actions
  # pins, never supabase/migrations, so skipping is safe. head_ref is set only on
  # pull_request events and is empty on push-to-main, so main still runs the real
  # check; and the #766 fail-loud path below still guards every non-dependabot
  # branch. main-push-guard reads only the `ci` check (not this one), so a skip
  # here never affects the merge-to-main backstop.
  # --- Automated security scanning (#1042) ---------------------------------------
  #
  # The bespoke guard layer (capped reads, swallowed errors, migration invariants,
  # the pinning and license checks) covers defect classes specific to this repo.
  # It says nothing about committed secrets or generic injection and authz
  # patterns, and GitHub's own push protection is a paid feature this org does not
  # have, so nothing server side catches either.
  #
  # Its own job rather than steps on `ci`, so a scanner outage or a rule change
  # cannot block a correctness failure from being reported, and so its runtime is
  # visible separately.
  #
  # Deliberately NOT in `deploy`'s `needs`, matching `coverage`. The semgrep rule
  # packs are fetched at run time (see below), so a newly published rule could
  # otherwise block an emergency deploy over code nobody touched, which is a worse
  # outcome than a late finding. Like every other control in this repo on the free
  # plan (see the main-push guard, #1027), it is DETECTIVE: a red run means look
  # now and rotate if needed, not "the change was prevented".
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history: the secret scan reads the commits a push ADDS, and needs the
      # base commit present to work out what that range is.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # The official gitleaks action requires a paid licence key for an
      # organisation, so the binary is fetched directly. Pinned by version AND
      # verified by checksum: an unverified download into a job is the same class
      # of exposure as an unpinned action tag, which is what #1051 was about.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The COMMITS this push adds, not the working tree. A secret added in one
      # commit and deleted in the next is still readable by anyone with repo
      # access and still needs rotating, and a working tree scan calls that clean.
      #
      # --redact so a hit never prints the credential into a public build log,
      # which would turn the detection into a second disclosure.
      - name: Scan for committed secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit, scanning full history instead of a range."
            gitleaks git --no-banner --redact --config .gitleaks.toml
          else
            echo "Scanning $BASE..$HEAD"
            gitleaks git --no-banner --redact --config .gitleaks.toml \
              --log-opts "$BASE..$HEAD"
          fi

      # Pinned, like everything else. NOTE the deliberate residual risk: the rule
      # PACKS are fetched from the semgrep registry at run time, so unlike the
      # binary they are not pinned and a newly published rule can fail a build
      # over code nobody touched. That is accepted rather than overlooked: the
      # alternative is vendoring a large ruleset that then never improves. When it
      # happens, fix the finding or annotate the line with `nosemgrep` and a
      # reason, and do not disable the job.
      - name: Install semgrep
        run: pipx install semgrep==1.172.0

      # p/typescript is the injection and authz surface the bespoke guards do not
      # cover; p/secrets is defence in depth beside gitleaks, matching on code
      # shape rather than on entropy.
      - name: Static analysis
        run: |
          semgrep scan --config p/typescript --config p/secrets \
            --error --quiet --metrics=off --disable-version-check

  migration-drift:
    if: ${{ ! startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # #1437: the CLI DOWNLOAD is its own upstream, and it hung up its socket
      # three times in a row on 2026-08-12, failing the job (and so skipping the
      # deploy) before any of our code ran. Actions has no native step retry, so
      # the first attempt is allowed to fail and a second one runs only if it did.
      # If the second also fails the job goes red, which is the point: this is a
      # bounded retry, not a way to proceed without the CLI.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        id: setup-supabase-cli
        continue-on-error: true
        with:
          # Pinned (not `latest`) so the step is deterministic: `latest`
          # resolves over the network and intermittently 502s, red-flagging CI.
          # Bump deliberately; this version is known-good for link + migration list.
          version: 2.84.2
      - name: Retry the Supabase CLI install (the download hung up, #1437)
        if: steps.setup-supabase-cli.outcome == 'failure'
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.84.2
      # #1433: the parse runs as a node script with a test suite rather than inline
      # awk. Pinned to the same major the rest of CI uses, and no pnpm install is
      # needed: the script imports local modules and nothing from node_modules.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Check for unapplied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # #766: this used to `exit 0` here, so a missing secret made the job pass green
          # in ~9s having verified nothing, while claiming to guard against code merging
          # ahead of its schema. A check that can pass while doing nothing is worse than
          # no check. Both secrets are required: linked without the DB password, the CLI
          # still cannot list migrations.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::migration-drift cannot run: SUPABASE_ACCESS_TOKEN and/or SUPABASE_DB_PASSWORD is not set. Configure both repo secrets. Failing rather than passing green while checking nothing (#766)."
            exit 1
          fi
          set -o pipefail
          # #1437: the CLI calls moved INTO the script, so the bounded retry that
          # stops a Supabase 502 red-flagging a good commit lives somewhere a suite
          # can drive (scripts/lib/migration-drift-cli.ts). It retries only a CLI
          # that could not ANSWER; a successful read is judged, never retried, so no
          # retry can turn real drift into a pass.
          #
          # The parse is a second module with its own suite
          # (scripts/lib/migration-drift.ts), not a rule in this block where nothing
          # can test it (#1433). It reads only real table rows, so the CLI's own
          # upgrade notice can never be read as an unapplied migration, and it treats
          # reading NO rows as a failure rather than as an applied database.
          node --experimental-strip-types scripts/check-migration-drift.ts \
            --project-ref drukfvgaynzrralbzkzj

  # Deploy to the slate Worker on every push to main, after ci passes. Skips
  # (passes) until the CLOUDFLARE_API_TOKEN secret is set; run pnpm cf:deploy
  # locally in the meantime. The NEXT_PUBLIC_* values are public (inlined into
  # the client bundle); set the publishable key as a repo variable.
  #
  # Also needs migration-drift (#482): deploys do NOT apply migrations (that stays
  # a human `supabase db push` step, see docs/migrations-runbook.md). If a migration
  # is still unapplied when a merge reaches main, this dependency fails the deploy
  # loudly instead of shipping a feature whose schema is missing. Under the runbook
  # the migration is applied before merge, so migration-drift is already green here.
  deploy:
    needs: [ci, migration-drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # #1037: stamp the commit INTO the bundle before building, so the live
      # Worker can report which version it is serving and the probe below can tell
      # the new deploy from the previous one. Must run before cf:deploy (which
      # builds), or the bundle carries the "dev" placeholder and the probe compares
      # nothing.
      - name: Stamp build info with the deploying commit
        run: node --experimental-strip-types scripts/stamp-build-info.ts "$GITHUB_SHA"

      - name: Deploy (Cloudflare / OpenNext)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_APP_URL: https://slate.trypennie.app
          NEXT_PUBLIC_SUPABASE_URL: https://drukfvgaynzrralbzkzj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com
        run: |
          # This job only runs on a push to main (see `if:` above), so a missing
          # token is never a legitimate skip: it means main is silently NOT
          # deploying. Fail loudly (#233) with an annotation, don't exit 0 green.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=main is NOT deploying::CLOUDFLARE_API_TOKEN is unset on a push to main, so this merge did not deploy. Add the secret under Settings > Secrets and variables > Actions, then re-run this job (or run 'pnpm cf:deploy' locally)."
            exit 1
          fi
          pnpm cf:deploy

      # #1037: every merge reaches 100% of traffic instantly, and detection used to
      # fall to the scheduled canary (~30 min for the dry tick, ~6h for funnel
      # breakage). This probes the live site immediately: it POLLS /api/smoke/version
      # until the commit just deployed is actually being served, and only THEN judges
      # /api/health and the availability read path. Checking health without that
      # confirmation would get a 200 from the previous version during Cloudflare's
      # propagation window and report a broken deploy as healthy.
      #
      # A failure here fails this job, and a failed job on a push to main already
      # posts a Slack alert (.github/workflows/deploy-alert.yml), so no new alerting
      # is needed. It does NOT roll back; it makes a bad deploy loud.
      - name: Post-deploy probe (live site is serving this commit and is healthy)
        env:
          APP_URL: https://slate.trypennie.app
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/post-deploy-probe.ts
