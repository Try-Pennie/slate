name: CI

# `push` is restricted to main; PR branches are covered by `pull_request` (#602).
# An unfiltered `push:` alongside `pull_request:` ran the ENTIRE pipeline twice on
# every PR commit (typecheck + lint + ~126 node suites + vitest + the full OpenNext
# build, all of it, twice). The push trigger still has to fire on main, because the
# deploy job is gated on a push to main.
on:
  push:
    branches:
      - main
  pull_request:

# Supersede an in-flight run when a newer commit lands on the same ref, so pushing a
# fix-up to a PR doesn't leave the previous run grinding through a Cloudflare build
# nobody is waiting for.
#
# NEVER on main: a run on main IS the production deploy, so cancelling one could
# interrupt a deploy mid-flight and leave the live Worker on a half-shipped state.
# Runs on main always go to completion. Pinned by scripts/test-ci-workflow.ts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fail the build on a NEW high (or critical) advisory in a production
      # dependency (#1026). Known, unremediated advisories are allow-listed in
      # package.json pnpm.auditConfig.ignoreGhsas and tracked in #1057, so this
      # gate stays green today but fires the moment something new lands, instead
      # of a Next.js-style lag where nothing was watching. --prod scopes it to
      # what actually ships to the Worker (dev-only advisories don't gate merges).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build (Cloudflare / OpenNext)
        run: pnpm cf:build
        env:
          # Build-time NEXT_PUBLIC_* inlining only; no real secrets needed.
          NEXT_PUBLIC_APP_URL: https://slate.trypennie.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com

  # Report-only merged coverage across both harnesses (#603). Its own job so it
  # never gates merge: a hard threshold on this mixed harness would be noisy. The
  # summary prints in the log and the lcov is uploaded as an artifact.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Merged coverage report
        run: pnpm test:coverage
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  # Fails if a committed migration hasn't been applied to the linked project, so
  # code can't merge expecting schema that isn't pushed. REQUIRES the
  # SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD repo secrets: without them the job
  # fails loudly rather than passing green while checking nothing (#766).
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not `latest`) so the step is deterministic — `latest`
          # resolves over the network and intermittently 502s, red-flagging CI.
          # Bump deliberately; this version is known-good for link + migration list.
          version: 2.84.2
      - name: Check for unapplied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # #766: this used to `exit 0` here, so a missing secret made the job pass green
          # in ~9s having verified nothing, while claiming to guard against code merging
          # ahead of its schema. A check that can pass while doing nothing is worse than
          # no check. Both secrets are required: linked without the DB password, the CLI
          # still cannot list migrations.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::migration-drift cannot run: SUPABASE_ACCESS_TOKEN and/or SUPABASE_DB_PASSWORD is not set. Configure both repo secrets. Failing rather than passing green while checking nothing (#766)."
            exit 1
          fi
          supabase link --project-ref drukfvgaynzrralbzkzj
          supabase migration list --linked | tee /tmp/mig.txt
          # A row with a local migration number but a blank remote = unapplied.
          if awk -F'|' '{ l=$1; r=$2; gsub(/[^0-9]/,"",l); gsub(/[^0-9]/,"",r); if (l!="" && r=="") { print "Unapplied: " $0; bad=1 } } END { exit bad+0 }' /tmp/mig.txt; then
            echo "All committed migrations are applied on remote."
          else
            echo "::error::Committed migrations are not applied to the remote DB. Run: supabase db push"
            exit 1
          fi

  # Deploy to the slate Worker on every push to main, after ci passes. Skips
  # (passes) until the CLOUDFLARE_API_TOKEN secret is set; run pnpm cf:deploy
  # locally in the meantime. The NEXT_PUBLIC_* values are public (inlined into
  # the client bundle); set the publishable key as a repo variable.
  #
  # Also needs migration-drift (#482): deploys do NOT apply migrations (that stays
  # a human `supabase db push` step, see docs/migrations-runbook.md). If a migration
  # is still unapplied when a merge reaches main, this dependency fails the deploy
  # loudly instead of shipping a feature whose schema is missing. Under the runbook
  # the migration is applied before merge, so migration-drift is already green here.
  deploy:
    needs: [ci, migration-drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Deploy (Cloudflare / OpenNext)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_APP_URL: https://slate.trypennie.app
          NEXT_PUBLIC_SUPABASE_URL: https://drukfvgaynzrralbzkzj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com
        run: |
          # This job only runs on a push to main (see `if:` above), so a missing
          # token is never a legitimate skip: it means main is silently NOT
          # deploying. Fail loudly (#233) with an annotation, don't exit 0 green.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=main is NOT deploying::CLOUDFLARE_API_TOKEN is unset on a push to main, so this merge did not deploy. Add the secret under Settings > Secrets and variables > Actions, then re-run this job (or run 'pnpm cf:deploy' locally)."
            exit 1
          fi
          pnpm cf:deploy
