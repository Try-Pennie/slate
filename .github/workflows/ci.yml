name: CI

# `push` is restricted to main; PR branches are covered by `pull_request` (#602).
# An unfiltered `push:` alongside `pull_request:` ran the ENTIRE pipeline twice on
# every PR commit (typecheck + lint + ~126 node suites + vitest + the full OpenNext
# build, all of it, twice). The push trigger still has to fire on main, because the
# deploy job is gated on a push to main.
on:
  push:
    branches:
      - main
  pull_request:

# Supersede an in-flight run when a newer commit lands on the same ref, so pushing a
# fix-up to a PR doesn't leave the previous run grinding through a Cloudflare build
# nobody is waiting for.
#
# NEVER on main: a run on main IS the production deploy, so cancelling one could
# interrupt a deploy mid-flight and leave the live Worker on a half-shipped state.
# Runs on main always go to completion. Pinned by scripts/test-ci-workflow.ts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # #1592 split the pipeline into parallel legs; #1611 split the two long ones,
  # because they had converged. Measured on run 33272627643: checks 148s (tsc 17s,
  # lint 22s, node suite 81s) and vitest 133s (vitest 100s) were within 15s of each
  # other, so splitting EITHER alone just promoted the other to critical path.
  # #1595 reached that conclusion about vitest and declined to shard it; this does
  # both at once, which is the only version that moves anything.
  #
  # Each job pays about 25s of fixed setup (checkout, pnpm, node, install), so
  # splitting trades billed minutes for wall time on purpose: roughly two extra
  # billed minutes per run. The short checks are the exception, folded back into
  # one job (below), because they finish well inside the longest leg anyway.
  #
  # None of these is named `ci`. Exactly one check carries that name (the fan-in),
  # because main-push-guard.yml resolves whether a merge was green by selecting
  # check runs literally named `ci`. Pinned by scripts/test-ci-workflow.ts.
  #
  # The short checks, in one job (typecheck, lint, the production audit and the
  # migration drift check). Each took under a minute as its own job, and every job
  # is billed as at least a whole minute plus about 25s of its own setup, so as
  # three jobs they cost about 2,400 billed minutes a month more than this does.
  # Run in sequence they take about 100s, still inside node-tests, so nothing
  # waits longer. Pinned by scripts/test-ci-workflow.ts.
  #
  # A step stops the job at its first failure by default, which would let a type
  # error hide every lint finding and the drift verdict. So each check after the
  # first runs `if: !cancelled()`, and one push reports all of them. The typecheck
  # and lint also need the install to have worked, or they would only report that
  # node_modules is missing.
  #
  # The migration drift check fails while any committed migration is unapplied on
  # the remote DB, so code cannot merge expecting schema that is not there. Being
  # in this job puts it inside the `ci` gate, which is what the migrations runbook
  # has always called it. REQUIRES the SUPABASE_ACCESS_TOKEN and
  # SUPABASE_DB_PASSWORD repo secrets: without them it fails loudly rather than
  # passing green while checking nothing (#766).
  #
  # Whether the drift steps run is decided by ONE step, "Decide whether the
  # migration drift check runs" (scripts/migration-drift-gate.ts, logic in
  # scripts/lib/migration-drift-gate.ts with its own suite, #3051). Dependabot runs
  # never receive the repo secrets, so the check could only false-fail there. The
  # gate skips ONLY a pull request whose head branch is dependabot/* AND whose actor
  # is dependabot[bot] AND whose diff (read from the PR merge commit, hence
  # fetch-depth 2) names no file under supabase/migrations/, and it says so as a
  # notice and a step summary rather than passing silently. A Dependabot PR that
  # touches a migration, or whose diff cannot be read, refuses like #766; every
  # other branch is unchanged. The decision sits on the steps rather than the job
  # so the typecheck and lint still run on those PRs.
  static-checks:
    timeout-minutes: 10  # sum of the three former jobs' measured maxes (43s, 47s, 19s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit plus its first parent, so the drift gate can read
          # what the pull request changes (#3051). Without the parent it fails closed.
          fetch-depth: 2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Fail the build on a NEW high (or critical) advisory in a production
      # dependency (#1026), instead of a Next.js-style lag where nothing was
      # watching. --prod scopes it to what actually ships to the Worker
      # (dev-only advisories don't gate merges).
      #
      # pnpm.auditConfig.ignoreGhsas in package.json is EMPTY as of #1057, so
      # this gate is green on its own merit rather than by suppression. It held
      # two entries before, both for a sharp advisory reachable only through
      # next's image optimizer; the #1057 bump took sharp out of the tree
      # entirely, which made both moot. Consequence worth knowing: a future bump
      # that puts a vulnerable sharp back now fails this step rather than being
      # silently allow-listed. That is the intent. Anything added back here needs
      # a reason and an issue that removes it again, or it becomes a standing
      # false assurance.
      #
      # It rides in this job rather than getting its own: it is a 1s
      # step, and a job of its own would pay 25s of setup to run it.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # #3093: the build and deploy toolchain, which `--prod` leaves out. wrangler and
      # the OpenNext adapter build the shipped bundle and run with the Cloudflare
      # deploy token in their environment, so an advisory in them, or in anything
      # they pull in, passed every gate. Critical only: the dev tree carried seven
      # high advisories and no critical one on 2026-10-03, in test and lint tooling
      # that never sees a credential, and a level that fails on all of them would be
      # red from the day it shipped. The daily audit (dependency-audit.yml) runs the
      # same command, so an advisory published against an unchanged tree is seen too.
      - name: Audit the whole tree, build and deploy toolchain included
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=critical

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc --noEmit

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      # #3051: run, skip (with a notice and a step summary saying why) or refuse.
      # Imports nothing from node_modules, so it runs even when the install failed.
      - name: Decide whether the migration drift check runs
        id: drift-gate
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node --experimental-strip-types scripts/migration-drift-gate.ts

      # #1437: the CLI DOWNLOAD is its own upstream, and it hung up its socket
      # three times in a row on 2026-08-12, failing the job (and so skipping the
      # deploy) before any of our code ran. Actions has no native step retry, so
      # the first attempt is allowed to fail and a second one runs only if it did.
      # If the second also fails the job goes red, which is the point: this is a
      # bounded retry, not a way to proceed without the CLI.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        id: setup-supabase-cli
        continue-on-error: true
        if: ${{ !cancelled() && steps.drift-gate.outputs.decision == 'run' }}
        with:
          # Pinned (not `latest`) so the step is deterministic: `latest`
          # resolves over the network and intermittently 502s, red-flagging CI.
          # Bump deliberately; this version is known-good for link + migration list.
          version: 2.84.2
      - name: Retry the Supabase CLI install (the download hung up, #1437)
        id: retry-supabase-cli
        if: ${{ !cancelled() && steps.setup-supabase-cli.outcome == 'failure' && steps.drift-gate.outputs.decision == 'run' }}
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.84.2
      # #1433: the parse runs as a node script with a test suite rather than inline
      # awk. It imports local modules and nothing from node_modules, so it does not
      # need the install above and still runs when that failed.
      # Only once one install attempt worked: with no CLI the script would just
      # report that `supabase` is missing, after its retry ladder had spent minutes
      # on it. The step stays red either way, because the failed retry already is.
      - name: Check for unapplied migrations
        if: ${{ !cancelled() && steps.drift-gate.outputs.decision == 'run' && (steps.setup-supabase-cli.outcome == 'success' || steps.retry-supabase-cli.outcome == 'success') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # #766: this used to `exit 0` here, so a missing secret made the job pass green
          # in ~9s having verified nothing, while claiming to guard against code merging
          # ahead of its schema. A check that can pass while doing nothing is worse than
          # no check. Both secrets are required: linked without the DB password, the CLI
          # still cannot list migrations.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::migration-drift cannot run: SUPABASE_ACCESS_TOKEN and/or SUPABASE_DB_PASSWORD is not set. Configure both repo secrets. Failing rather than passing green while checking nothing (#766)."
            exit 1
          fi
          set -o pipefail
          # #1437: the CLI calls moved INTO the script, so the bounded retry that
          # stops a Supabase 502 red-flagging a good commit lives somewhere a suite
          # can drive (scripts/lib/migration-drift-cli.ts). It retries only a CLI
          # that could not ANSWER; a successful read is judged, never retried, so no
          # retry can turn real drift into a pass.
          #
          # The parse is a second module with its own suite
          # (scripts/lib/migration-drift.ts), not a rule in this block where nothing
          # can test it (#1433). It reads only real table rows, so the CLI's own
          # upgrade notice can never be read as an unapplied migration, and it treats
          # reading NO rows as a failure rather than as an applied database.
          node --experimental-strip-types scripts/check-migration-drift.ts \
            --project-ref drukfvgaynzrralbzkzj

  node-tests:
    timeout-minutes: 15  # measured max 106s projected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests (node suites)
        run: pnpm test:node

  # Two shards in parallel. The DENOMINATOR is derived from the matrix via
  # `strategy.job-total`, never written beside it: a literal would be a second
  # place to update, and a shard count that disagrees with the matrix leaves files
  # no job ever runs while every shard still passes the subset it was handed.
  # scripts/test-ci-workflow.ts fails the build on either mistake.
  #
  # fail-fast is off so one shard failing does not cancel its sibling; otherwise a
  # red run cannot say whether the rest of the suite passes.
  vitest:
    timeout-minutes: 15  # measured max 75s projected
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Component and route tests (vitest, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: pnpm test:components --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build:
    timeout-minutes: 15  # measured max 78s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (Cloudflare / OpenNext)
        run: pnpm cf:build
        env:
          # Build-time NEXT_PUBLIC_* inlining only; no real secrets needed.
          NEXT_PUBLIC_APP_URL: https://slate.trypennie.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com

  # The fan-in, and the ONLY check anything outside this file reads.
  #
  # `if: always()` is load bearing rather than defensive. Without it a failed leg
  # SKIPS this job, and a skipped check is not a failed one: main-push-guard's jq
  # scores it "null" (unknown), which the classifier deliberately tolerates, so a
  # red PR would merge with the backstop saying nothing. With always(), the job
  # runs whatever the legs did and turns their results into a real conclusion.
  #
  # The results are read from `needs.*.result` rather than named one by one, so a
  # leg added to `needs` is judged without anyone remembering to edit this step
  # (L41). A matrix job reports ONE aggregated result here, so a single failing
  # shard fails the gate. Anything other than `success` fails: a cancelled or
  # skipped leg is not a pass.
  ci:
    needs: [static-checks, node-tests, vitest, build, security-scan]
    if: always()
    timeout-minutes: 5  # measured max 4s
    runs-on: ubuntu-latest
    steps:
      # The legs are read from `toJSON(needs)`, so a leg added to `needs` is judged
      # without anyone editing this step (L41), and each result carries its leg's
      # name, which the one exception below needs.
      #
      # #3087: security-scan is a leg, and it GATES A PULL REQUEST, so a change that
      # fails the secret scan or static analysis cannot merge green. On a push its
      # own `if:` skips it at once, so nothing here waits for a scan; this step
      # excuses exactly that skip. The push is scanned by security-scan-main, outside
      # this fan-in, whose red result fails the run and pages through
      # deploy-alert.yml. Pinned, block and all, by scripts/test-ci-workflow.ts,
      # which runs this exact script.
      - name: Every CI leg succeeded
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          PR_ONLY_LEGS="security-scan"
          if ! results="$(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$NEEDS")"; then
            echo "::error::The CI fan-in could not read its legs' results, so it has verified nothing. Failing rather than passing green."
            exit 1
          fi
          echo "leg results ($EVENT_NAME): $(tr '\n' ' ' <<<"$results")"
          if [ -z "$results" ]; then
            echo "::error::The CI fan-in read no leg results at all, so it has verified nothing. Failing rather than passing green."
            exit 1
          fi
          failed=""
          while IFS='=' read -r leg r; do
            if [ "$r" != "success" ]; then
              # Only SKIPPED is excused, and only off a pull request: that is the leg's
              # own `if:` keeping it off main. A pull-request-only leg that somehow ran
              # and failed here still fails, so a broken `if:` is not waved through.
              if [ "$EVENT_NAME" != "pull_request" ] && [ "$r" = "skipped" ] && [[ " $PR_ONLY_LEGS " == *" $leg "* ]]; then
                echo "$leg is skipped on $EVENT_NAME by design: it gates pull requests only, and security-scan-main covers this push."
                continue
              fi
              failed="$failed $leg=$r"
            fi
          done <<<"$results"
          if [ -n "$failed" ]; then
            echo "::error::A CI leg did not succeed:$failed. Open the run and look at the red leg."
            exit 1
          fi
          echo "All CI legs succeeded."

  # Coverage USED TO BE A JOB HERE and now lives in .github/workflows/coverage.yml
  # (#2395, #2402). It is report-only (#603), gated nothing, and its placement in
  # this run cost two separate things: about 4,700 billed minutes a month on a
  # budget that refused a job on 10 September, and about four minutes of delay on
  # the deploy failure alert, which cannot fire until this run completes and so
  # waited for a report every time production shipped a broken commit.
  #
  # Nothing to re-add here. A coverage number for one commit is
  # `gh workflow run coverage.yml --ref <branch>`; the merge logic it exercises
  # still runs in `pnpm test` on every pull request.

  # --- Automated security scanning (#1042) ---------------------------------------
  #
  # The bespoke guard layer (capped reads, swallowed errors, migration invariants,
  # the pinning and license checks) covers defect classes specific to this repo.
  # It says nothing about committed secrets or generic injection and authz
  # patterns, and GitHub's own push protection is a paid feature this org does not
  # have, so nothing server side catches either.
  #
  # Its own job rather than steps on `ci`, so a scanner outage or a rule change
  # cannot block a correctness failure from being reported, and so its runtime is
  # visible separately.
  #
  # TWO jobs, one scan (#3087). The steps live once, in the local composite action
  # .github/actions/security-scan, and each job is a checkout plus that action:
  #
  #   - `security-scan` runs on a PULL REQUEST only and is a leg of the `ci`
  #     fan-in, so a change that fails it cannot merge green. On a push its job
  #     level `if:` skips it at once, so the fan-in, and the deploy behind it,
  #     never WAIT for a scan whose result main tolerates (L304).
  #   - `security-scan-main` runs on a PUSH only, outside the fan-in and outside
  #     `deploy`'s `needs`. The semgrep rule packs are fetched at run time, so a
  #     newly published rule must not block an emergency deploy over code nobody
  #     touched. There it is DETECTIVE, like every other control over main on the
  #     free plan (see the main-push guard, #1027): a red scan fails the CI run,
  #     deploy-alert.yml pages naming it, and a red run means look now and rotate
  #     if needed.
  security-scan:
    if: github.event_name == 'pull_request'
    timeout-minutes: 15  # measured max 97s
    runs-on: ubuntu-latest
    steps:
      # Full history: the secret scan reads the commits a pull request ADDS, and
      # needs the base commit present to work out what that range is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/security-scan

  security-scan-main:
    if: github.event_name == 'push'
    # alert-latency-ok: it finishes about three minutes BEFORE the deploy does, so
    # it never holds the run open and never delays the deploy failure alert
    # (#2402). Measured 86s and 97s against deploys ending at 302s and 300s, runs
    # 35112495998 and 35115428061. Pinned by scripts/test-deploy-alert-latency.ts.
    timeout-minutes: 15  # measured max 97s
    runs-on: ubuntu-latest
    steps:
      # Full history: the secret scan reads the commits a push ADDS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/security-scan

  # Deploy to the slate Worker on every push to main, after ci passes. Skips
  # (passes) until the CLOUDFLARE_API_TOKEN secret is set; run pnpm cf:deploy
  # locally in the meantime. The NEXT_PUBLIC_* values are public (inlined into
  # the client bundle); set the publishable key as a repo variable.
  #
  # Also needs static-checks, which runs the migration drift check (#482): deploys
  # do NOT apply migrations (that stays a human `supabase db push` step, see
  # docs/migrations-runbook.md). If a migration is still unapplied when a merge
  # reaches main, this dependency fails the deploy loudly instead of shipping a
  # feature whose schema is missing. It is named here as well as reached through
  # `ci`, so taking it out of the fan-in still could not ship code ahead of its
  # schema. Under the runbook the migration is applied before merge, so the check
  # is already green here.
  deploy:
    # 20, not the 15 its siblings get: the post-deploy probe POLLS for up to
    # DEFAULT_VERSION_TIMEOUT_MS (240s) waiting for Cloudflare to serve the new
    # commit, and this bound has to clear that comfortably or the job timeout
    # kills the probe before the probe can report its own honest failure, which
    # would read as a hung deploy rather than as propagation never completing.
    # Pinned against the probe's own constant by scripts/test-workflow-timeouts.ts.
    timeout-minutes: 20  # measured max 103s, of which the probe may poll 240s
    needs: [ci, static-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job level, so it REPLACES the repo default for this job only: checkout needs
    # contents, and the ci gate below reads the commit's check runs.
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # #3088: refuse unless the `ci` fan-in passed on THIS exact sha, read back from
      # GitHub rather than trusted from `needs` above. `needs` is one line of YAML: an
      # edit to it, or an always() on this job, would ship with nothing checking. This
      # is the second, independent half, and it runs before the install so a refusal
      # spends nothing. Bare node, no dependencies (scripts/check-ci-before-deploy.ts).
      # It does NOT stop a direct push to main whose own ci is green; that half stays
      # with the main push guard, which detects it after the fact.
      - name: Refuse unless ci passed on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/check-ci-before-deploy.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # #1037: stamp the commit INTO the bundle before building, so the live
      # Worker can report which version it is serving and the probe below can tell
      # the new deploy from the previous one. Must run before cf:deploy (which
      # builds), or the bundle carries the "dev" placeholder and the probe compares
      # nothing.
      - name: Stamp build info with the deploying commit
        run: node --experimental-strip-types scripts/stamp-build-info.ts "$GITHUB_SHA"

      - name: Deploy (Cloudflare / OpenNext)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_APP_URL: https://slate.trypennie.app
          NEXT_PUBLIC_SUPABASE_URL: https://drukfvgaynzrralbzkzj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_HOSTED_DOMAIN: trypennie.com
        run: |
          # This job only runs on a push to main (see `if:` above), so a missing
          # token is never a legitimate skip: it means main is silently NOT
          # deploying. Fail loudly (#233) with an annotation, don't exit 0 green.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=main is NOT deploying::CLOUDFLARE_API_TOKEN is unset on a push to main, so this merge did not deploy. Add the secret under Settings > Secrets and variables > Actions, then re-run this job (or run 'pnpm cf:deploy' locally)."
            exit 1
          fi
          pnpm cf:deploy

      # #1037: every merge reaches 100% of traffic instantly, and detection used to
      # fall to the scheduled canary (~30 min for the dry tick, ~6h for funnel
      # breakage). This probes the live site immediately: it POLLS /api/smoke/version
      # until the commit just deployed is actually being served, and only THEN judges
      # /api/health and the availability read path. Checking health without that
      # confirmation would get a 200 from the previous version during Cloudflare's
      # propagation window and report a broken deploy as healthy.
      #
      # A failure here fails this job, and a failed job on a push to main already
      # posts a Slack alert (.github/workflows/deploy-alert.yml), so no new alerting
      # is needed. It does NOT roll back; it makes a bad deploy loud.
      - name: Post-deploy probe (live site is serving this commit and is healthy)
        env:
          APP_URL: https://slate.trypennie.app
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          GITHUB_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/post-deploy-probe.ts
