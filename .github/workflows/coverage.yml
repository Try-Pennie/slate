name: Coverage

# Report-only merged coverage across both harnesses (#603). It lived as a job in
# ci.yml until #2395 and #2402, which are two symptoms of the same placement:
#
#   COST. #1593 kept it on every merge to main and recorded the choice as a
#   sentence: about 4m05s a run, about 1,000 billed minutes a month, a weekly
#   schedule declined because "a per-merge record is worth the difference".
#   Nothing re-measured any of it. Measured 2026-09-16 the job takes 8m33s to
#   9m04s, which bills 9 or 10 minutes, and main took 258 pushes in the 15 days
#   from 2 September, so the real figure was roughly 4,700 billed minutes a month
#   against the 1,000 the decision rests on. On 10 September the account's
#   spending limit refused the `ci` fan-in on run 34532636820 after all nine legs
#   had passed, so a green merge was never deployed and its deploy failure alert
#   was refused too (run 34533260624).
#
#   LATENCY. deploy-alert.yml fires on the CI run's own completion, so nothing
#   could post until coverage finished. Measured on six merges, the deploy ended
#   217s to 281s before the run did, which is four minutes of nobody knowing that
#   production is serving a broken commit, spent waiting on a report that gates
#   nothing.
#
# Moving it to its own scheduled workflow answers both: the CI run now completes
# when the deploy does, and the report costs a thirtieth of what it did while
# still being taken often enough to see a change land. What is given up is a
# coverage number attached to one merge; the run is stamped with the commit it
# read, and `workflow_dispatch` re-runs it on demand when one change's effect
# matters. The coverage MERGE LOGIC is not what moved:
# scripts/test-coverage-orchestration.ts still runs in `pnpm test`, so it is
# checked on every pull request exactly as before.
#
# COST PREMISE (#2395), recorded as numbers with the command that re-measures
# them rather than as a dated sentence, so the next drift is a diff (L316).
# Re-measure with:
#   gh api "repos/Try-Pennie/slate/actions/workflows/coverage.yml/runs?per_page=20" --jq '.workflow_runs[].id'
#   gh api "repos/Try-Pennie/slate/actions/runs/<id>/jobs" --jq '.jobs[] | [.name, .started_at, .completed_at] | @tsv'
# Measured 2026-09-16 on six merges to main (runs 35115428061, 35112495998,
# 35111352989, 35105764041, 35102610040, 35018357994): the coverage job ran for
# 513s, 539s, 526s, 532s, 544s and 538s, which GitHub bills as 9, 9, 9, 9, 10 and
# 9 minutes. The per run figure below is the WORST of those, not the mean, since
# billing rounds each job up on its own.
# cost-premise: runs-per-month=31 billed-minutes-per-run=10 ceiling-billed-minutes-per-month=400
#
# scripts/test-coverage-cadence.ts derives the cadence from the cron below and
# fails when it stops agreeing with that line, so the premise cannot go stale
# while the schedule moves underneath it.
#
# AN ALERT, NO HEARTBEAT (#3101). This used to carry neither, on the argument that the
# number was only read when somebody cared. But the ratchet (#1050) FAILS the run on a
# regressed or unmeasured verdict, and a scheduled red run nobody is told about is a
# detector nobody looks at, reached after the change has already deployed. So the last
# step runs whatever the coverage step exited with and posts on exactly those two
# verdicts: a regression below a floor, or a night that measured nothing. A pass, or a
# gain asking for the floor to be raised, says nothing (L36). Still no heartbeat: a
# dropped night costs one reading the next night supplies. The alerter is bare node
# with no dependencies (scripts/notify-coverage.ts), so it runs even when the install
# is what failed, and that case reads as unmeasured rather than as a quiet night.
#
# Note this alert is about the RATCHET, not the deploy: while coverage sat in ci.yml a
# failed upload painted the whole CI run red, and on 2026-09-08 that posted "deploy
# failed" for a deploy that had succeeded (deploy-alert run 34250093987 on CI run
# 34249335474, the 403 recorded in #2084). That stays fixed: nothing here touches CI.
on:
  schedule:
    # 05:40 UTC, about 01:40 Eastern: nobody is merging, so the report is not
    # competing for a runner slot with a real merge's CI, which on this account is
    # the budget that actually binds (L307). Not on the hour, where GitHub's
    # scheduling queue is busiest and runs are most often dropped, matching the
    # other scheduled lanes here.
    - cron: "40 5 * * *"
  workflow_dispatch:

# A superseded run is safe to cancel here: this workflow deploys nothing and writes
# no database row or heartbeat. It does have one outward effect since #3101, the
# Slack post on a regressed or unmeasured night, and a cancelled run must not make
# it, or the superseded run pages that it "could not measure" (L36, L671). So the
# alert step is gated on `!cancelled()` rather than `always()`: it still speaks
# after a failure, and stays silent for a run the newer one replaced. ci.yml's own
# concurrency is deliberately the opposite on main, because a run there IS the
# deploy.
concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  # The job key stays `coverage`, so the check reads `Coverage / coverage` rather
  # than `CI / coverage`: the job half of the name is unchanged for anything that
  # looks for it. Nothing requires it as a status check (main is unprotected and
  # rulesets are a paid feature this org does not have, confirmed 2026-09-16), and
  # it never ran on a pull request, so it could never have been a required one.
  coverage:
    timeout-minutes: 20  # measured max 544s
    runs-on: ${{ vars.PENNIE_CI_RUNNER == 'pennie-mac' && 'pennie-mac' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Which commit this report is about. On a schedule the run is no longer
      # attached to one merge, so a number with no commit beside it cannot be
      # compared with the last one.
      - name: Say which commit is being measured
        run: |
          set -euo pipefail
          echo "Coverage for $GITHUB_SHA on $GITHUB_REF_NAME"
          git --no-pager log -1 --format='%H %ci %s'
      - name: Merged coverage report
        run: pnpm test:coverage
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
      # #3101: tell a person on a regressed or unmeasured verdict, whatever the coverage
      # step exited with, unless the run was CANCELLED (superseded): see the
      # concurrency note above. Reads coverage/verdict.json, which coverage.mjs
      # writes; a run that died before writing it reads as unmeasured. Bare node, no
      # alias hook: scripts/test-dependency-free-scripts.ts holds it to importing
      # nothing outside scripts/.
      - name: Say what the ratchet found
        if: ${{ !cancelled() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types scripts/notify-coverage.ts
