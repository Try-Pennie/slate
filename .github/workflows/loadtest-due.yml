name: Load run due

# The re-run rule for the booking path load run (#3103).
#
# `loadtest.yml` can only be dispatched by hand, and between 2026-09-15 and 2026-10-03
# the confirm path and the minute tick both changed with no run recorded, because the
# rule to re-run it lived in nobody's head (L27). This is the rule: a push to main that
# changes the confirm path or a cron lane opens ONE issue saying a run is due, or adds a
# comment naming the push to the one already open. Nothing here runs the load test; a
# run needs a throwaway Supabase branch and a deployment somebody has to provision
# (scripts/loadtest/RUNBOOK.md). Close the issue in the PR that records the run.
#
# The path list is `LOADTEST_DUE_PATHS` in scripts/lib/loadtest-due-paths.ts, and
# scripts/test-loadtest-due-paths.ts holds the block below equal to it and checks that
# every cron route and the confirm route fall under it, so a lane added somewhere new
# cannot be exempt by accident (L96).
#
# Cost: one short job per qualifying push, on the free GITHUB_TOKEN; no repo secret.
on:
  push:
    branches: [main]
    paths:
      - "src/app/api/bookings/**"
      - "src/lib/booking/**"
      - "src/lib/availability/**"
      - "src/lib/google/**"
      - "src/lib/rate-limit.ts"
      - "src/lib/rate-limit-core.ts"
      - "src/lib/rate-limit-burst.ts"
      - "src/app/api/cron/**"
      - "worker/**"
      - "wrangler.jsonc"

# Keyed on the push, so EVERY qualifying push runs (#3553, L1020). It used to be one
# constant group, to stop two pushes each finding no issue and opening two, but GitHub
# keeps one running and ONE pending run per group and a third arrival cancels the
# pending one even with cancel-in-progress false, so in a burst of merges the middle
# push was never named. Two runs that race now settle on the lowest numbered issue
# afterwards (scripts/lib/loadtest-due-nag.ts). Pinned by scripts/test-loadtest-due-nag.ts.
concurrency:
  group: loadtest-due-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  nag:
    runs-on: ${{ vars.PENNIE_CI_RUNNER == 'pennie-mac' && 'pennie-mac' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No dependency install: the script imports nothing outside scripts/
      # (scripts/test-dependency-free-scripts.ts). setup-node pins the version the
      # type stripping flag needs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Name this push on the load run due issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: node --experimental-strip-types scripts/loadtest-due-nag.ts
