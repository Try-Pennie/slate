name: Deploy failure alert

# Fire when the CI workflow finishes. We alert only on a FAILED run for a push to
# main (see the job `if:` gate): the case where the live site may silently have
# stopped updating (#122). workflow_run sees the whole run's conclusion, so this
# covers a failed deploy, ci, or migration-drift job, not just one step. The
# workflow file must live on the default branch for workflow_run to trigger.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  alert:
    timeout-minutes: 10  # one Slack post; it only runs on a failure, so no successful run was in the sample
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # #1598: NO dependency install. This job exists to send one Slack message, and it
      # fires precisely when CI on main has already failed, which correlates with GitHub
      # or the network having a bad day, so every dependency it carries is another way
      # for the alert to be unavailable in exactly the conditions it exists for. It used
      # to carry pnpm/action-setup, setup-node with the pnpm cache and a full
      # `pnpm install --frozen-lockfile`, purely because the alerter reached Slack
      # through the app's notifier and from there the tunable channel lookup and the
      # Supabase client. The same removal was made for the main push guard in #1524,
      # after run 32039856279 died at `Failed to download action 'pnpm/action-setup'`
      # with a 429 and the only control over main never ran; this is its sibling, which
      # that fix did not cover. The alerter now posts through scripts/lib/slack-post.ts,
      # which imports nothing, so node and this checkout are all it needs.
      #
      # setup-node is the one that stays: it pins the node version the type stripping
      # flag needs, rather than trusting whatever the runner image happens to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Post Slack alert
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        # No alias hook: nothing under src/ is reachable from the alerter any more, and
        # scripts/test-dependency-free-scripts.ts walks its real import graph to prove it
        # rather than reading this line.
        run: node --experimental-strip-types scripts/notify-deploy-failure.ts
