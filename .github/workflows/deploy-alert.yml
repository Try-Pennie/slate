name: Deploy failure alert

# Fire when the CI workflow finishes. We alert only on a FAILED run for a push to
# main (see the job `if:` gate): the case where the live site may silently have
# stopped updating (#122). workflow_run sees the whole run's conclusion, so this
# covers a failed deploy, ci, or migration-drift job, not just one step. The
# workflow file must live on the default branch for workflow_run to trigger.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  alert:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Post Slack alert
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/notify-deploy-failure.ts
