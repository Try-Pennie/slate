name: Schedule parity

# The daily Slate against cal.com comparison (#2031).
#
# `pnpm verify:calcom-parity` compares the two systems' rosters and the working week
# each holds for it. It was hand run, so it found what it found on the day somebody
# remembered: 97 schedules were imported on 2026-09-02 and verified idempotent the
# same day, and five days later 21 of 102 agents had drifted. Three were not being
# offered a day they work; two were being offered a Saturday they do not. Nothing
# else in Slate can see any of it, because a stored schedule saying 08:00 is
# indistinguishable from an agent who really starts at 08:00 (#1738).
#
# It runs HERE and not on the Worker's monitor lane: the sweep is roughly one cal.com
# read per agent, about a hundred subrequests, and the four cron lanes share one
# invocation budget the recompute lane already runs at 100 to 120 percent of (#2022).
#
# The result is REPORTED BACK to Slate rather than posted to Slack from here, because
# drift is a condition rather than an event: it stays true until somebody corrects one
# side, so it needs an all clear and must not repeat every morning while it sits. Both
# need a memory of what was said yesterday, which a runner has none of.
#
# Needs the CALCOM_API_KEY, BOOKING_API_KEY_CANARY, SUPABASE_SECRET_KEY, SLACK_BOT_TOKEN and
# the three TWILIO_* repo secrets, and the SLACK_ALERTS_CHANNEL and SLATE_BASE_URL
# repo variables. The Twilio three became required when #2153 made the withheld set
# come from Twilio's worker tags; they were not wired at the time, and this lane died
# on the first morning after that merged with nothing but a stale heartbeat to say so.
# GitHub's schedule below is best effort and DROPS runs under load, the same way it
# drops the canary's (observed 2 to 3 hour gaps against a 30 minute cadence). On a
# DAILY cadence a dropped run costs the whole day, and until #2414 the only recovery
# was a person reading the 30 hour staleness page and dispatching this by hand, which
# is not a remedy: the sweep that watches Slate and cal.com for drifting apart could
# go two days blind.
#
# So the Worker's monitor cron lane re fires this workflow through the GitHub API
# (workflow_dispatch, no inputs) once the schedule-parity heartbeat passes 27h30m,
# which is this cadence plus GitHub's measured lateness plus this job's own timeout
# below. See src/lib/monitor/canary-trigger.ts; it needs the GITHUB_CANARY_TOKEN
# Worker secret, and it is a quiet no op while that is unset. The concurrency group
# below dedupes any overlap between the two triggers, and the 30 hour page is now the
# backstop for both failing rather than the recovery path.
#
# A re attempt repeats this job's WRITE (the apply step corrects drifted hours from
# cal.com), which is the same side effect the dropped scheduled run would have had,
# and the import is idempotent.
on:
  schedule:
    # 12:20 UTC, which is mid morning Eastern: late enough that a correction made in
    # the morning is picked up the same day, early enough that a page still leaves a
    # working day to act in. Not on the hour, where GitHub's scheduling queue is
    # busiest and runs are most often dropped.
    #
    # ONE line, deliberately. A second cron a few hours later was the other way to
    # answer a dropped run, and it is dispatched by the same scheduler that drops
    # them, so it reduces the class without removing it, while paying a checkout, an
    # install and a job slot every day for a sweep that had usually already
    # succeeded. The gap fill above fires from the reliable lane and only when the
    # heartbeat says the run really is missing.
    - cron: "20 12 * * *"
  # No inputs. The gap fill dispatch sends none, because GitHub answers 422 to a
  # dispatch carrying an input the workflow does not declare, and that failure is
  # invisible from the Worker: the run simply never happens. Adding one here means
  # adding it to DISPATCH_TARGETS in src/lib/monitor/canary-trigger.ts in the same
  # change; scripts/test-canary-trigger.ts reads this file and asserts the two agree.
  workflow_dispatch:

concurrency:
  group: schedule-parity
  cancel-in-progress: false

jobs:
  parity:
    # Two cal.com passes now, the import and the sweep, each paced at 250ms per
    # agent, so roughly 1 min per 100 agents each.
    timeout-minutes: 25
    runs-on: ${{ vars.PENNIE_CI_RUNNER == 'pennie-mac' && 'pennie-mac' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # #2875: once cal.com is marked retired on /admin/alerts, this whole job is a
      # comparison against a system nobody books through, and its apply step would
      # put stale cal.com hours over a week somebody set in Slate. So every step
      # below asks first. The apply runs only on a measured `0`, so a setting that
      # could not be read writes nothing; the rest run on anything but `1`, so the
      # same failure keeps today's comparison and report. The Worker stops watching
      # and re firing this lane on the same setting (src/lib/calcom/retirement.ts).
      - name: Is cal.com retired?
        id: retired
        # A crash here leaves `retired` empty, which every step below reads as
        # unknown: the apply is skipped and the rest run as today. Failing the job
        # instead would skip the comparison AND its failure alert.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://drukfvgaynzrralbzkzj.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/calcom-retired-check.ts

      # Skip quietly until the keys are configured, so merging this does not fail a
      # run every morning before setup. An absent key is "not configured yet"; a
      # present but wrong one still runs and reports.
      - name: Preflight (is the sweep configured?)
        id: pre
        env:
          CALCOM_API_KEY: ${{ secrets.CALCOM_API_KEY }}
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          # Named here as well as on the sweep step so a MISSING one is reported by
          # this step, which says what to create, rather than by the sweep failing
          # five minutes later with a message about Twilio.
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_WORKSPACE_SID: ${{ secrets.TWILIO_WORKSPACE_SID }}
        run: |
          missing=""
          for name in CALCOM_API_KEY BOOKING_API_KEY_CANARY TWILIO_API_KEY_SID TWILIO_API_KEY_SECRET TWILIO_WORKSPACE_SID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "configured=1" >> "$GITHUB_OUTPUT"
          else
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Not set as repo secrets, so the parity sweep is skipping:$missing. Add them in Settings > Secrets and variables > Actions."
          fi

      # THE CORRECTION RUNS BEFORE THE COMPARISON (#2092), and the ordering is the
      # whole change. Detection was automatic and repair was not: the sweep paged a
      # person to run this command by hand, so drift sat until somebody read the
      # message. Measured across three passes the roster went 97 out of step, then
      # 21 after five days, then 4 after one, because people are actively editing
      # schedules in cal.com while it is still the system taking every real lead.
      #
      # Applying FIRST and sweeping after means the message reports the state after
      # the repair, measured independently, rather than a subtraction computed from
      # the writer's own read-back. The alternative (sweep, then apply only what
      # drifted) costs the same two cal.com passes and leaves the report making a
      # claim instead of taking a reading.
      #
      # WHAT IT WILL NOT WRITE: a week an agent set for themselves
      # (`hoursOverwriteRefusal`). cal.com is the authority for these values only
      # while it is the system people maintain, and that guard is also what retires
      # this safely at cutover (#65) with nobody remembering to switch it off: once
      # agents set their own hours (#1454) every such row is stamped `agent` and the
      # import stops touching it. An agent with no cal.com windows, or a week Slate's
      # validator refuses, stays skipped and named exactly as the hand run reports it.
      #
      # `continue-on-error` for the same reason the sweep below carries it: the
      # import exits non-zero on a skip that needs a person, which is a finding
      # rather than a broken step, and failing the job here would skip the sweep and
      # the report and leave nobody told.
      - name: Correct drifted hours from cal.com
        id: apply
        continue-on-error: true
        if: steps.pre.outputs.configured == '1' && steps.retired.outputs.retired == '0'
        env:
          APPLY: "1"
          CALCOM_API_KEY: ${{ secrets.CALCOM_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://drukfvgaynzrralbzkzj.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # A literal path, like PARITY_SUMMARY_FILE below: an internal handoff
          # between two steps of the same job, not a setting anybody configures.
          PARITY_APPLY_FILE: parity-applied.json
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/import-calcom-schedules.ts

      # `continue-on-error`, because this step's exit code is the FINDING: it exits
      # non-zero on every difference by design, and a difference is what the run is
      # for. The report step below is what decides whether anybody is told, and
      # failing the job here would skip it and leave the finding in the Actions tab
      # with nobody reading it.
      - name: Compare Slate against cal.com
        id: sweep
        continue-on-error: true
        if: steps.pre.outputs.configured == '1' && steps.retired.outputs.retired != '1'
        env:
          CALCOM_API_KEY: ${{ secrets.CALCOM_API_KEY }}
          # The roster half reads Slate's own users through supabaseAdmin, so the
          # sweep needs the same two the app does. The URL is written out rather than
          # referenced as a repo variable, matching ci.yml: it is not a secret, and a
          # variable would be one more setting to create before this can ever run.
          NEXT_PUBLIC_SUPABASE_URL: https://drukfvgaynzrralbzkzj.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Required since #2153: Twilio's worker tags are what say who cal.com
          # actually routes to, and the sweep REFUSES to compare without them
          # rather than reading every withheld agent as agreement. Missing these
          # is what killed this lane on 2026-09-10, silently, the first morning
          # after #2153 merged.
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_WORKSPACE_SID: ${{ secrets.TWILIO_WORKSPACE_SID }}
          # A literal path, not a repo variable: it is an internal handoff between
          # two steps of the same job, and the report step reads the same path.
          PARITY_SUMMARY_FILE: parity-summary.json
        run: node --experimental-strip-types --import ./scripts/register-paths.mjs scripts/verify-calcom-parity-live.ts

      # Kept so `pnpm verify:parallel-run-readiness` can name WHO drifted (#2089)
      # without re-running a four minute sweep: the alert carries counts and a few
      # names, and nothing in Slate stores the rest. `continue-on-error`, because a
      # failed upload must never fail the job, which would skip the heartbeat stamp
      # and page the lane as stale over a convenience. No file (the sweep stopped
      # before it judged anything) uploads nothing, which the readiness command
      # reports as names unavailable.
      - name: Keep the sweep summary for the readiness command
        if: always() && steps.sweep.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-summary
          path: parity-summary.json
          if-no-files-found: ignore
          retention-days: 7

      # Bare node, no alias hook: this is the step that speaks after the expensive
      # part of the job, and scripts/test-dependency-free-scripts.ts holds it to
      # importing nothing outside scripts/.
      - name: Report the result to Slate
        id: report
        if: steps.pre.outputs.configured == '1' && steps.retired.outputs.retired != '1'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
          PARITY_SUMMARY_FILE: parity-summary.json
          # What the apply step above wrote, so the message can say what the lane
          # corrected by itself. An ABSENT file (the apply step died before it
          # decided) is deliberately different from one holding a zero, and the
          # alert says something different for each.
          PARITY_APPLY_FILE: parity-applied.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types scripts/report-schedule-parity.ts

      # Stamped ONLY after Slate accepted a measured sweep, never merely because the
      # workflow ran. A sweep that reached nobody exits non-zero above, so this is
      # skipped, the schedule-parity heartbeat goes stale after 30 hours and the lane
      # watchdog pages: a detector that has stopped concluding otherwise looks exactly
      # like one finding nothing wrong (#1394).
      - name: Stamp the parity heartbeat (a measured sweep only)
        if: success() && steps.pre.outputs.configured == '1' && steps.retired.outputs.retired != '1'
        env:
          BOOKING_API_KEY_CANARY: ${{ secrets.BOOKING_API_KEY_CANARY }}
          SLATE_BASE_URL: ${{ vars.SLATE_BASE_URL }}
        run: |
          base="${SLATE_BASE_URL:-https://slate.trypennie.app}"
          curl -fsS -X POST "${base%/}/api/smoke/heartbeat?lane=schedule-parity" \
            -H "authorization: Bearer $BOOKING_API_KEY_CANARY"

      # The drift itself is reported by Slate, through the app's own alerting. This
      # speaks about the OTHER failure: the sweep could not read cal.com, or could not
      # reach Slate to report. Without it those exit non-zero into an Actions tab
      # nobody is watching, and the only signal would be the heartbeat going stale
      # thirty hours later.
      - name: Slack alert when the sweep could not report
        if: failure() && steps.pre.outputs.configured == '1' && steps.retired.outputs.retired != '1'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ vars.SLACK_ALERTS_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types scripts/notify-parity-failure.ts
