name: Merge-gap guard

# Server-side backstop for the local pre-push merge-gap guard (.githooks/pre-push,
# #109/#113). The local hook fails OPEN: it no-ops when gh is missing or
# unauthenticated, only runs for local interactive pushes, and depends on each
# clone having run the prepare script that sets core.hooksPath. This workflow
# fires on every push to a non-main branch and fails when that branch's PR is
# already merged or closed, so a stranded follow-up commit (one that would never
# reach main) is caught even in the contexts the local hook cannot cover.
#
# It is a single few-second `gh` API call, NOT the full pipeline, so it does not
# reintroduce the #602 double-run (ci.yml still restricts its push trigger to
# main and covers PR branches via pull_request).
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-gap:
    timeout-minutes: 10  # measured max 13s
    runs-on: ${{ vars.PENNIE_CI_RUNNER == 'pennie-mac' && 'pennie-mac' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # #1436: the decision moved out of this block and into a script with a suite
      # (scripts/lib/merge-gap.ts). It used to read the PR list as
      # `states="$(gh pr list ... || echo '')"`, so a gh outage produced an empty
      # string, nothing matched, and the job printed "No merged/closed PR blocking"
      # and exited 0. This backstop had the SAME failure mode as the local hook it
      # compensates for, and a compensating control that reports green having asked
      # nothing is worse than no control, because it is believed.
      #
      # No pnpm install: the script imports two local modules and nothing from
      # node_modules.
      - name: Flag a push onto an already-merged/closed PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: node --experimental-strip-types scripts/check-merge-gap.ts
